# audiobookshelf-import — a distributable conductor pack.
#
# Automatic Audible -> Audiobookshelf pipeline. This pack BUNDLES the real scripts
# from github.com/NodeSpy/audiobookshelf-import (under scripts/) and runs them:
# conductor owns the scheduling, run history, pause, and failure surfacing that
# its `loop.sh` did by hand, and shells out to the shipped `sync.py` /
# `license-guard.py` / `seed-liberated.py` for the import itself. Those ~1200
# lines carry logic worth
# not reimplementing: duplicate detection, ASIN match verification, audio
# integrity checks, license-denial backoff, author-spelling reconcile, the
# series-prefix-clash guard, and companion/leftover cleanup.
#
#   discover  (schedule)  LibationCli scan -> export -> license-guard --eligible
#                         -> liberate the eligible ASINs -> license-guard --record
#                         -> re-export.  Never imports.
#   import    (schedule)  sync.py --prune-source: dedup, verify, upload, wait for
#                         ABS to index it, match by ASIN + verify it stuck, prune.
#   seed      (manual)    seed-liberated.py: tell Libation it already holds what
#                         ABS holds, so a fresh install doesn't re-download.
#
# The two halves are deliberately SEPARATE (two schedules), for the same reason
# the original splits them: a 50-hour download must not delay the next scan.
#
# RUNTIME: native on the host running conductor. The scripts talk to LibationCli
# and the ABS API directly, so this pack binds NO libation/audiobookshelf
# connector -- only a `cron` connector for the schedules. Everything the scripts
# need is passed through each step's env from the pack settings below.
#
# ------------------------------------------------------------------------------
# PREREQUISITES (one-time, on the box -- the pack cannot do these for you)
#
#   1. LibationCli installed natively + a one-time Audible login (its config, db
#      and master key under <lib_root>/config). Upstream ships Libation only as a
#      Docker image, so this is the load-bearing native step; `libation_cli` must
#      point at a working binary. The import half is independent of this -- it
#      only needs the manifest, the files, and ABS -- so imports work even before
#      Libation is set up.
#   2. python3 with `requests`  (pip install requests).  ffprobe, jq, flock must
#      be on PATH.  sync.py/license-guard.py read everything from env.
#      (The scripts themselves ship WITH the pack under scripts/ -- nothing to
#      check out; conductor runs them from the pack's vendored dir.)
#   3. An ABS API key (Settings -> API Keys). Supply it via the daemon's env and
#      wire it in as `abs_token: ${ABS_TOKEN}` (see install below).
#
# ------------------------------------------------------------------------------
# INSTALL (in your config's `packs:` block)
#
#   connectors:
#     timer: { use: cron, schedules: { discover: {every: 10m}, import: {every: 10m}, seed: {every: 24h} } }
#     books: { use: fswatch, watches: { staged: { path: /srv/Libation/books, match: "*.m4b", debounce: 15s } } }
#   packs:
#     audiobooks:
#       source: github.com/NodeSpy/conductor-packs//audiobookshelf-import
#       version: "~> 2.0"
#       connectors: { cron: timer, fswatch: books }
#       settings:
#         libation_cli: /opt/libation/LibationCli       # or just "LibationCli" if on PATH
#         lib_root: /srv/Libation                        # holds config/, db/, books/
#         abs_url: http://localhost:13378
#         abs_library: Audiobooks
#         abs_token: ${ABS_TOKEN}                        # token lives in the daemon env
#       triggers:
#         discover:    { enabled: true }
#         import_fast: { enabled: true }   # event-driven (fswatch) -- seconds latency
#         import:      { enabled: true }   # the sweep backstop -- longer interval is fine
#   Then: conductor init, conductor pack plan, conductor validate.
#
# NOTE (two import triggers): `import_fast` fires the moment a book settles
# (fswatch, debounced); `import` is the periodic sweep. KEEP BOTH -- inotify is
# lossy (events missed while the daemon is down, dropped on queue overflow,
# uneven on some FUSE mounts), so the sweep is what turns a missed event into
# latency rather than a book that never imports. The fswatch `path` must be the
# same books dir as `lib_root/books`. An empty pass returns after one `find`, so
# a frequent sweep is cheap. Everything else is at parity -- it is the same code.
#
# NOTE (state is preserved): .abs-synced.json, .license-denied.json, the lock
# files, and any of your own files in the books dir are never touched by the pack
# -- it only runs the scripts in place.

pack:
  name: audiobookshelf-import
  version: 2.2.0
  description: Audible -> Audiobookshelf pipeline (thin wrapper around the upstream sync.py / license-guard.py) -- a Libation discovery pass and a full import pass, on two schedules.
  tags: [audiobookshelf, libation, audible, media, pipeline]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # >=0.44.0: this pack's cli steps declare `isolation:` with a filesystem
    # allow-list (`fs:`) — the pivot_root namespace jail. On <0.44 that field is
    # unknown (strict-decoded → load error), and the confined-by-default sandbox
    # for pack code did not exist. >=0.43.0 gave us ${pack.dir} (the pack ships
    # its own sync.py/license-guard.py/seed-liberated.py under scripts/); fswatch
    # (>=0.38.0) and the cli engine predate both.
    conductor: ">=0.44.0"
    # cron: the sweep schedules. fswatch: the low-latency import trigger. The
    # scripts reach LibationCli and ABS themselves, so no libation/audiobookshelf
    # connector is needed.
    connectors: [cron, fswatch]

settings:
  libation_cli:
    type: string
    default: LibationCli
    desc: "Path to the native LibationCli binary (or a bare name on PATH). Discovery + seed only."
  lib_root:
    type: string
    default: /srv/Libation
    desc: "Libation's root; holds config/, db/, and books/. license-guard keeps .license-denied.json here."
  books_root:
    type: string
    default: ""
    desc: "The staging dir the importer reads + prunes. Empty => <lib_root>/books."
  abs_url:
    type: string
    default: http://localhost:13378
    desc: "Audiobookshelf base URL, as reachable from this host."
  abs_library:
    type: string
    default: Audiobooks
    desc: "Target ABS library, by name (case-insensitive) or id."
  abs_token:
    type: string
    default: ""
    desc: "ABS API key. Set to ${ABS_TOKEN} so the token comes from the daemon env, not the config file."
  max_new:
    type: integer
    default: 25
    desc: "Ceiling on books liberated per discovery pass -- stops a fresh/misseeded DB from pulling the whole library."
  workers:
    type: integer
    default: 3
    desc: "Concurrent imports. Above 1, an ABS item is only claimed on an exact destination-path match."
  retry_denied_hours:
    type: number
    default: 24
    desc: "How long a license-denied book is held back before being retried."
  audio_ext:
    type: string
    default: m4b
    desc: "Audio file extension to stage and import."
  duration_tolerance:
    type: number
    default: 0.05
    desc: "Allowed drift vs the catalogue duration in the ffprobe integrity check."
  min_age:
    type: integer
    default: 60
    desc: "Seconds a file must be untouched before it is considered settled and importable."
  seed_apply:
    type: boolean
    default: false
    desc: "The seed trigger reports only (dry run) unless this is true. Flip it, run once, then disarm seed."

workflows:
  # The import pass, shared by both import triggers (the cron sweep and the
  # fswatch event). Mirrors docker/import.sh. The step's flock makes it safe for
  # the two triggers to fire close together. An empty pass returns after one find
  # without contacting ABS.
  import:
    description: "Push whatever audio is staged on disk into Audiobookshelf (sync.py --prune-source)."
    steps:
      - id: import
        use: cli
        isolation:
          # Least-privilege filesystem JAIL (conductor >=0.44). The script sees
          # ONLY the Libation root (books, import lock, sync state) and its own
          # shipped scripts — the daemon's config/state/secrets are hidden by
          # ABSENCE, not merely masked. Network is left open (shared host net):
          # sync.py talks to ABS at abs_url, and there is no proxy in the way.
          # If books_root is set OUTSIDE lib_root, add it here; if you want ABS
          # egress locked down, add `network: { deny: true, egress: [host:port] }`.
          mode: namespace
          fs:
            - "${settings.lib_root}"
            - "${pack.dir}"
        env:
          SCRIPTS_DIR: "${pack.dir}/scripts"
          LIB_ROOT: "${settings.lib_root}"
          LIB_BOOKS_ROOT: "${settings.books_root}"
          ABS_URL: "${settings.abs_url}"
          ABS_TOKEN: "${settings.abs_token}"
          ABS_LIBRARY: "${settings.abs_library}"
          AUDIO_EXT: "${settings.audio_ext}"
          WORKERS: "${settings.workers}"
          DURATION_TOLERANCE: "${settings.duration_tolerance}"
          MIN_AGE: "${settings.min_age}"
        command:
          - bash
          - -c
          - |
            set -uo pipefail
            say() { printf '%s  %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$*"; }
            SCRIPTS="${SCRIPTS_DIR:?SCRIPTS_DIR unset}"
            LIB_ROOT="${LIB_ROOT:?LIB_ROOT unset}"
            BOOKS="${LIB_BOOKS_ROOT:-$LIB_ROOT/books}"
            MANIFEST="$BOOKS/library.json"
            LOCK="$BOOKS/.import.lock"

            exec 9>"$LOCK" || { say "FATAL: cannot open lock $LOCK"; exit 1; }
            flock -n 9 || { say "another import pass is already running, skipping"; exit 0; }

            if [ ! -f "$MANIFEST" ]; then
              say "no manifest at $MANIFEST yet - waiting for the first discovery pass"
              exit 0
            fi

            staged=$(find "$BOOKS" -type f -name "*.${AUDIO_EXT:-m4b}" -print -quit 2>/dev/null)
            [ -z "$staged" ] && exit 0

            say "=== import start ==="
            python3 "$SCRIPTS/sync.py" \
              --source-root "$BOOKS" \
              --prune-source \
              --state "$BOOKS/.abs-synced.json" \
              --workers "${WORKERS:-3}"
            rc=$?
            say "=== import done (rc=$rc) ==="
            exit "$rc"

triggers:
  # 1. DISCOVER -- ask Audible what's new and download the eligible books. Mirrors
  #    docker/discover.sh, path-corrected for a native host. Never imports.
  - name: discover
    "on": cron.discover
    steps:
      - id: discover
        use: cli
        isolation:
          # fs jail (conductor >=0.44): the Libation root + shipped scripts only.
          # Network open — LibationCli reaches Audible and cannot honor an egress
          # proxy, so egress is not lockable here. If libation_cli lives outside
          # /usr (e.g. /opt/libation/LibationCli), add its directory to fs.
          mode: namespace
          fs:
            - "${settings.lib_root}"
            - "${pack.dir}"
        env:
          SCRIPTS_DIR: "${pack.dir}/scripts"
          LIBATION_CLI: "${settings.libation_cli}"
          LIB_ROOT: "${settings.lib_root}"
          LIB_BOOKS_ROOT: "${settings.books_root}"
          MAX_NEW: "${settings.max_new}"
          RETRY_DENIED_HOURS: "${settings.retry_denied_hours}"
        command:
          - bash
          - -c
          - |
            set -uo pipefail
            say() { printf '%s  %s\n' "$(date '+%Y-%m-%d %H:%M:%S')" "$*"; }
            CLI="${LIBATION_CLI:?LIBATION_CLI unset}"
            SCRIPTS="${SCRIPTS_DIR:?SCRIPTS_DIR unset}"
            LIB_ROOT="${LIB_ROOT:?LIB_ROOT unset}"
            BOOKS="${LIB_BOOKS_ROOT:-$LIB_ROOT/books}"
            export LIB_ROOT LIB_BOOKS_ROOT="$BOOKS"
            MANIFEST="$BOOKS/library.json"
            MAX_NEW="${MAX_NEW:-25}"
            LOCK="$BOOKS/.discover.lock"

            exec 9>"$LOCK" || { say "FATAL: cannot open lock $LOCK"; exit 1; }
            flock -n 9 || { say "another discovery pass is already running, skipping"; exit 0; }

            say "=== discover start ==="
            say "scanning Audible for new purchases"
            "$CLI" scan || { say "FATAL: scan failed. If the log mentions ExistingAccessToken, re-create the Audible credentials (README 'Logging in')."; exit 1; }

            say "exporting library manifest"
            "$CLI" export -j -p "$MANIFEST" || { say "FATAL: export failed"; exit 1; }
            [ -f "$MANIFEST" ] || { say "FATAL: export produced no $MANIFEST"; exit 1; }

            mapfile -t eligible < <(python3 "$SCRIPTS/license-guard.py" --eligible 2>/dev/null)
            pending=${#eligible[@]}
            unavailable=$(jq '[.[] | select(.BookStatus != "Liberated")] | length' "$MANIFEST" 2>/dev/null || echo 0)
            unavailable=$(( unavailable - pending ))

            if [ "$pending" -eq 0 ]; then
              if [ "$unavailable" -gt 0 ]; then
                say "nothing new to download ($unavailable unavailable: not in the Audible library, or license denied)"
              else
                say "nothing new to download"
              fi
            elif [ "$pending" -gt "$MAX_NEW" ]; then
              say "REFUSING to liberate: $pending books pending, ceiling is MAX_NEW=$MAX_NEW."
              say "  A fresh database reports the whole library as pending. If Audiobookshelf already"
              say "  holds these, run the seed trigger. If this really is a backlog, raise max_new."
              exit 0
            else
              say "liberating $pending book(s)${unavailable:+, $unavailable unavailable}"
              ids=(); for asin in "${eligible[@]}"; do ids+=(-i "$asin"); done
              LIBLOG="$(mktemp /tmp/liberate.XXXXXX)"
              "$CLI" liberate "${ids[@]}" 2>&1 | tee "$LIBLOG"
              [ "${PIPESTATUS[0]}" -ne 0 ] && say "warning: liberate returned non-zero, continuing"
              python3 "$SCRIPTS/license-guard.py" --record "$LIBLOG" || say "warning: could not record denials"
              rm -f "$LIBLOG"
              say "re-exporting manifest"
              "$CLI" export -j -p "$MANIFEST" || say "warning: re-export failed"
            fi
            say "=== discover done ==="

  # 2. IMPORT (fast) -- fire the moment a book settles on disk, via the fswatch
  #    source. Debounced (collapses one download's burst of events into a single
  #    pass); latency is seconds, not a poll interval.
  - name: import_fast
    "on": fswatch.staged
    steps:
      - id: run
        workflow: import

  # 3. IMPORT (sweep) -- the backstop. fswatch/inotify is lossy (events missed
  #    while the daemon is down, dropped on queue overflow, uneven on some FUSE
  #    mounts), so a periodic pass guarantees a missed event costs latency, not a
  #    book that never imports. Cheap: an empty pass returns after one find. Runs
  #    the SAME workflow; the import lock serializes the two.
  - name: import
    "on": cron.import
    steps:
      - id: run
        workflow: import

  # 3. SEED (disarmed; one-time). Tell Libation it already holds what ABS holds, so
  #    a fresh install doesn't re-download the back catalogue. Reports only unless
  #    seed_apply=true. Enable, set seed_apply, run once, then disarm.
  - name: seed
    "on": cron.seed
    steps:
      - id: seed
        use: cli
        isolation:
          # fs jail (conductor >=0.44): the Libation root + shipped scripts only.
          # Network open (seed-liberated.py talks to ABS; LibationCli to Audible).
          mode: namespace
          fs:
            - "${settings.lib_root}"
            - "${pack.dir}"
        env:
          SCRIPTS_DIR: "${pack.dir}/scripts"
          LIBATION_CLI: "${settings.libation_cli}"
          LIB_ROOT: "${settings.lib_root}"
          LIB_BOOKS_ROOT: "${settings.books_root}"
          ABS_URL: "${settings.abs_url}"
          ABS_TOKEN: "${settings.abs_token}"
          ABS_LIBRARY: "${settings.abs_library}"
          AUDIO_EXT: "${settings.audio_ext}"
          SEED_APPLY: "${settings.seed_apply}"
        command:
          - bash
          - -c
          - |
            set -uo pipefail
            SCRIPTS="${SCRIPTS_DIR:?SCRIPTS_DIR unset}"
            LIB_ROOT="${LIB_ROOT:?LIB_ROOT unset}"
            export LIB_ROOT LIB_BOOKS_ROOT="${LIB_BOOKS_ROOT:-$LIB_ROOT/books}"
            if [ "${SEED_APPLY:-false}" = "true" ]; then
              echo "seed: applying (set-status downloaded for books ABS already holds)"
              python3 "$SCRIPTS/seed-liberated.py" --apply
            else
              echo "seed: DRY RUN (report only). Set seed_apply=true to write."
              python3 "$SCRIPTS/seed-liberated.py"
            fi
