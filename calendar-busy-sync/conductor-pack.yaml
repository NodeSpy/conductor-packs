# calendar-busy-sync — a distributable conductor pack.
#
# Keep several Google calendars honest about when you are busy. Every event on
# a SOURCE calendar gets a private "Busy" block on every other TARGET calendar,
# so someone booking you on one calendar sees the time the others already
# hold. Blocks follow the source: moved when it moves, removed when it is
# cancelled, declined, or marked free. A repeating event gets one repeating
# block.
#
# Pure verbs + js steps — no agent, no model, no cost. No database: the
# calendars are the state. Each block carries a private extended property
# naming the source event it stands for, so a rerun is a no-op and a missed
# run is caught up by the next.
#
# What blocks time: an event that shows as busy and that you have not
# declined — all-day and out-of-office included, Free events and anything
# with `[nosync]` in its description not.
#
# Triggers: on_change / on_target_change (Google push), sweep (cron backstop
# + manual), cleanup (manual, one-time: retire BusyBridge's blocks).
# backup / verify (nightly JSON + ICS snapshots and a weekly restore test),
# only when a backup connector is bound.
#
# Install (in your config's `packs:` block — see README.md for the full config
# and the Google OAuth setup):
#   packs:
#     busy:
#       source: github.com/NodeSpy/conductor-packs//calendar-busy-sync
#       version: "~> 1.0"
#       connectors:
#         sources: [cal-personal, cal-work, cal-side]   # whose events block time
#         targets: [cal-work, cal-side]                 # where the blocks are written
#         cron: timer
#       triggers:
#         sweep:     { enabled: true }   # the periodic pass; keep it armed
#         on_change: { enabled: true }   # optional: push-driven, needs watch: on each source

pack:
  name: calendar-busy-sync
  version: 1.1.0
  description: Mirror busy time across any number of Google calendars as private "Busy" blocks, kept in step by Google push plus a sweep; one repeating block per repeating event; optional nightly JSON/ICS backups with a restore test; a one-time cleanup of BusyBridge blocks for moving over. Pure verbs, no agent.
  tags: [calendar, google-calendar, busy, scheduling, sync, backup]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # >=0.107.0: list sockets (`many: true`) with `over:`/`member:` steps
    # (0.106), and an unbound optional connector parking the workflows that
    # call it (0.107) — so a config without a backup connector loads.
    conductor: ">=0.107.0"
    connectors:
      # List sockets: you name every calendar the pack may read and write. A
      # calendar may sit in both lists (two work calendars that block each
      # other); it never receives a block for its own events.
      # google-calendar >=1.2.0: the `changed` push source and paged `events`.
      sources: { many: true, type: google-calendar, version: ">=1.2.0" }
      targets: { many: true, type: google-calendar, version: ">=1.2.0" }
      # The sweep schedule. Your cron connector must declare `busy_sync`
      # (and `busy_backup` / `busy_verify` if you arm those triggers).
      cron: "*"
      # Optional: bind a backup connector to get nightly backups and a weekly
      # restore test. Leave it out and those two triggers are dormant.
      backup: { version: ">=1.0.0", required: false }

settings:
  # ---- what gets a block
  window_days:
    type: integer
    default: 60
    desc: "How far ahead to mirror. Blocks beyond this appear as the window rolls forward."
  mirror_all_day:
    type: boolean
    default: true
    desc: "Mirror all-day events that are marked busy. Google makes all-day events Free unless you mark them busy, so reminders and birthdays never block either way."
  sync_out_of_office:
    type: boolean
    default: true
    desc: "Mirror out-of-office events."
  nosync_tag:
    type: string
    default: "[nosync]"
    desc: "An event whose description contains this (any case) is never mirrored. Empty turns it off."
  skip_already_busy:
    type: boolean
    default: true
    desc: "No block for a source event the target already shows as busy on its own (a slot you blocked by hand, or the same commitment entered on both calendars)."
  repeating_blocks:
    type: boolean
    default: true
    desc: "A repeating event gets one repeating block. Off: a block per occurrence."
  # ---- what a block looks like
  block_title:
    type: string
    default: Busy
    desc: "Title of a block. Used for every block unless show_details is on."
  show_details:
    type: boolean
    default: false
    desc: "Copy the source event's title onto the block instead of block_title. Blocks stay private either way."
  color_id:
    type: string
    default: "8"
    desc: "Google event colour id for blocks (1-11; 8 is graphite). Empty leaves the calendar's own colour."
  managed_tag:
    type: string
    default: ""
    desc: "Written as each block's description, so you can search a calendar for every block (e.g. [Busy]). Empty: no description."
  tag:
    type: string
    default: conductorBusySync
    desc: "Private extended-property name that marks a block as this pack's. Change it only to run two independent instances over the same calendar."
  # ---- guards
  dry_run:
    type: boolean
    default: false
    desc: "Plan and log only; create, move and delete nothing. Start with it on."
  max_deletes:
    type: integer
    default: 50
    desc: "Refuse a run that would delete more than this many blocks whose source events have vanished — a guard against a bad read wiping every block."
  batch_size:
    type: integer
    default: 50
    desc: "Most blocks created, moved or removed per run (each counted separately); the BusyBridge cleanup uses it too. The rest follow on the next runs. Keep it under your policy.max_fan_out (100 by default)."
  remove_all:
    type: boolean
    default: false
    desc: "Remove every block in the window (and a year back) instead of syncing. Leave it on for a few sweeps before uninstalling, then disarm."
  # ---- backups (only with a backup connector bound)
  backup_tiers:
    type: string
    default: ""
    desc: "Comma-separated backup tiers to write and verify. Empty: every tier of the bound backup connector."
  backup_prefix:
    type: string
    default: calendar
    desc: "Set names are <prefix>-<connector>-json / -ics (e.g. calendar-cal-work-ics), plus <prefix>-index."
  backup_days_back:
    type: integer
    default: 365
    desc: "The backup covers events from this many days ago..."
  backup_days_ahead:
    type: integer
    default: 730
    desc: "...to this many days ahead (repeating events are kept as one series)."
  # ---- BusyBridge cleanup
  cleanup_max_ops:
    type: integer
    default: 1000
    desc: "The BusyBridge cleanup refuses to make more changes than this in total."

workflows:
  # One full reconcile. Stateless: it reads every source and target for the
  # window, works out which blocks should exist, and makes the targets match.
  # Running it twice is a no-op, so the push trigger and the sweep share it.
  reconcile:
    description: "Make every target calendar's busy blocks match the source calendars' events."
    steps:
      # Settings are substituted as text, so they cross into js as strings.
      - id: cfg
        set:
          mode: plan
          window_days: "${settings.window_days}"
          block_title: "${settings.block_title}"
          show_details: "${settings.show_details}"
          color_id: "${settings.color_id}"
          managed_tag: "${settings.managed_tag}"
          mirror_all_day: "${settings.mirror_all_day}"
          sync_out_of_office: "${settings.sync_out_of_office}"
          nosync_tag: "${settings.nosync_tag}"
          skip_already_busy: "${settings.skip_already_busy}"
          repeating_blocks: "${settings.repeating_blocks}"
          tag: "${settings.tag}"
          max_deletes: "${settings.max_deletes}"
          batch_size: "${settings.batch_size}"
          remove_all: "${settings.remove_all}"

      - id: window
        use: js
        code: |
          const days = parseInt(ctx.cfg.window_days, 10);
          if (!(days > 0)) throw new Error("window_days must be a positive integer");
          const now = new Date();
          if (now.getUTCFullYear() < 2025) throw new Error("js clock looks wrong: " + now.toISOString());
          const back = String(ctx.cfg.remove_all) === "true" ? 366 : 0;
          return {
            timeMin: new Date(now.getTime() - back * 86400000).toISOString(),
            timeMax: new Date(now.getTime() + days * 86400000).toISOString(),
          };

      # Every calendar is read twice. EXPANDED (singleEvents), each occurrence
      # of a repeating event is its own item: that decides which occurrences
      # need a block. RAW, a repeating event is one item carrying its
      # recurrence rule, plus one item per changed or cancelled occurrence:
      # that is what lets a repeating event get ONE repeating block.
      # The targets are read whole (not just this pack's blocks): the plan
      # also needs the target's own events. A failed read fails the run here —
      # nothing is deleted on a partial picture.
      - parallel:
          - - { id: src, uses: sources.events, over: true, parallel: true, progress: reading source calendars,
                options: { timeMin: "{{.window.timeMin}}", timeMax: "{{.window.timeMax}}", singleEvents: true, maxResults: 2500 } }
          - - { id: srcraw, uses: sources.events, over: true, parallel: true,
                options: { timeMin: "{{.window.timeMin}}", timeMax: "{{.window.timeMax}}", singleEvents: false, maxResults: 2500 } }
          - - { id: dst, uses: targets.events, over: true, parallel: true, progress: reading target calendars,
                options: { timeMin: "{{.window.timeMin}}", timeMax: "{{.window.timeMax}}", singleEvents: true, maxResults: 2500 } }
          - - { id: dstraw, uses: targets.events, over: true, parallel: true,
                options: { timeMin: "{{.window.timeMin}}", timeMax: "{{.window.timeMax}}", singleEvents: false, maxResults: 2500 } }

      - id: plan
        use: js
        code: &busy_js |
          // calendar-busy-sync — the pack's logic, run as a `use: js` code step body
          // (an IIFE: top-level `return` is the step's outputs). One file, two modes,
          // picked by the workflow's `cfg` step:
          //
          //   plan      the reconcile: which busy blocks to create / change / remove on
          //             each target calendar so it matches the source calendars
          //   cleanup   the one-time BusyBridge cleanup: delete its future blocks, end
          //             its recurring series at now, keep its past
          //
          // Calendars arrive keyed by connector name, from `over:` read steps over the
          // pack's two list sockets: ctx.<step>.by_member = { <connector>: { items } }.
          // Every write op names its `target` connector, which the workflow passes to
          // `member:`.
          //
          // Pure: it reads ctx and returns data. The workflow does the I/O with verb
          // steps, so this file runs unchanged under node in the tests.

          const cfg = ctx.cfg || {};
          const mode = cfg.mode;

          function bool(v, dflt) {
            if (v === undefined || v === null || v === "") return dflt;
            if (typeof v === "boolean") return v;
            return String(v).trim().toLowerCase() === "true";
          }
          function num(v, dflt) {
            const n = Number(v);
            return v !== "" && v !== null && v !== undefined && Number.isFinite(n) ? n : dflt;
          }
          // calendars(id) → { <connector>: [events] } from an `over:` read step. A
          // calendar that read back without an item list fails the run: a partial
          // picture would look like every one of its events had gone.
          function calendars(id) {
            const s = ctx[id];
            const by = s && s.by_member;
            if (!by || typeof by !== "object") throw new Error("step " + id + " returned no calendars");
            const out = {};
            for (const name of Object.keys(by).sort()) {
              const r = by[name];
              const items = Array.isArray(r) ? r : r && r.items;
              if (!Array.isArray(items)) throw new Error("step " + id + ": " + name + " returned no items");
              out[name] = items;
            }
            return out;
          }

          const TAG = cfg.tag || "conductorBusySync"; // private extended property: the block's key
          const SIG = TAG + "Sig";                    // a repeating block's signature
          const priv = (e) => (e && e.extendedProperties && e.extendedProperties.private) || {};
          const tagOf = (e) => priv(e)[TAG] || "";

          // BusyBridge's blocks: deterministic ids `bb` + 13 base32hex chars (a
          // modified instance carries `_<stamp>` after it), or its private property.
          const BB_ID = /^bb[0-9a-v]{13}(_|$)/;
          function isBusyBridge(e) {
            return BB_ID.test(e.id || "") || priv(e).bb_proj_id !== undefined;
          }
          const isAllDay = (e) => !!(e.start && e.start.date);
          function timeMs(t) {
            if (!t) return NaN;
            if (t.dateTime) return Date.parse(t.dateTime);
            if (t.date) return Date.parse(t.date + "T00:00:00Z");
            return NaN;
          }
          const startMs = (e) => timeMs(e.start);
          const selfDeclined = (e) => (e.attendees || []).some((a) => a.self && a.responseStatus === "declined");
          function hasNoSync(e, tag) {
            return !!tag && (e.description || "").toLowerCase().indexOf(tag.toLowerCase()) >= 0;
          }

          // ---------------------------------------------------------------------------
          // plan — the reconcile
          // ---------------------------------------------------------------------------
          function planMode() {
            const rules = {
              title: cfg.block_title || "Busy",
              showDetails: bool(cfg.show_details, false),
              colorId: cfg.color_id === undefined ? "8" : String(cfg.color_id),
              description: cfg.managed_tag ? String(cfg.managed_tag) : "",
              mirrorAllDay: bool(cfg.mirror_all_day, true),
              syncOOO: bool(cfg.sync_out_of_office, true),
              repeatingBlocks: bool(cfg.repeating_blocks, true),
              noSyncTag: cfg.nosync_tag === undefined ? "[nosync]" : String(cfg.nosync_tag),
              skipAlreadyBusy: bool(cfg.skip_already_busy, true),
            };
            const removeAll = bool(cfg.remove_all, false);
            const maxDeletes = num(cfg.max_deletes, 50);
            const batch = num(cfg.batch_size, 50);
            if (!(batch > 0)) throw new Error("batch_size must be a positive integer");

            const srcBy = calendars("src"), srcRawBy = calendars("srcraw");
            const dstBy = calendars("dst"), dstRawBy = calendars("dstraw");
            const srcNames = Object.keys(srcBy).sort();
            const dstNames = Object.keys(dstBy).sort();

            const live = (e) => e && e.status !== "cancelled" && e.start && e.end;
            // Someone's real event: never a block, ours or BusyBridge's.
            const real = (e) => live(e) && !tagOf(e) && !isBusyBridge(e);
            const edge = (t) => (t.dateTime ? String(Date.parse(t.dateTime)) : "d" + t.date);
            const len = (e) => timeMs(e.end) - timeMs(e.start);
            // The same meeting on two calendars shares an iCalUID; the start pins the
            // occurrence.
            const meeting = (e) => (e.iCalUID ? e.iCalUID + "@" + edge(e.start) : "");

            // Busy on its own calendar: shows as busy, and you have not declined it.
            const busy = (e) => real(e) && e.transparency !== "transparent" && e.eventType !== "workingLocation" && !selfDeclined(e);

            // What gets a block on the other calendars: an event that shows as busy
            // and you have not declined. Google makes all-day events Free unless you
            // mark them busy, so a busy all-day event is a deliberate one.
            const blocks = (e) => {
              if (!busy(e)) return false;
              if (e.eventType === "outOfOffice" && !rules.syncOOO) return false;
              if (hasNoSync(e, rules.noSyncTag)) return false;
              return !isAllDay(e) || rules.mirrorAllDay;
            };

            const title = (e) => (rules.showDetails && e.summary ? e.summary : rules.title);
            const shell = (key, summary) => {
              const b = {
                summary,
                transparency: "opaque",
                visibility: "private",
                reminders: { useDefault: false, overrides: [] },
                extendedProperties: { private: { [TAG]: key } },
              };
              if (rules.description) b.description = rules.description;
              if (rules.colorId) b.colorId = rules.colorId;
              return b;
            };
            const when = (t) => {
              if (t.date) return { date: t.date };
              const out = { dateTime: t.dateTime };
              if (t.timeZone) out.timeZone = t.timeZone;
              return out;
            };
            // A block for one event or one occurrence.
            const single = (key, e) => Object.assign(shell(key, title(e)), { start: when(e.start), end: when(e.end) });

            // A repeating event can be mirrored as one repeating block when its rule can
            // be copied as it stands. A COUNT rule cannot: the block starts at the first
            // occurrence still ahead, which would restart the count. Those fall back to
            // one block per occurrence.
            const repeats = (m) => rules.repeatingBlocks && !!m && Array.isArray(m.recurrence) && m.recurrence.length > 0 &&
              !m.recurrence.some((r) => /[:;]COUNT=/i.test(r)) && !!(m.start && (m.start.date || m.start.timeZone));
            const pad = (n) => String(n).padStart(2, "0");
            // The RFC 5545 line that leaves one occurrence out, by its original start.
            const exdate = (t) => {
              if (t.date) return "EXDATE;VALUE=DATE:" + t.date.replace(/-/g, "");
              const d = new Date(Date.parse(t.dateTime));
              return "EXDATE:" + d.getUTCFullYear() + pad(d.getUTCMonth() + 1) + pad(d.getUTCDate()) + "T" +
                pad(d.getUTCHours()) + pad(d.getUTCMinutes()) + pad(d.getUTCSeconds()) + "Z";
            };
            const hash = (s) => {
              let a = 2166136261, b = 5381;
              for (let i = 0; i < s.length; i++) {
                const c = s.charCodeAt(i);
                a = Math.imul(a ^ c, 16777619) >>> 0;
                b = (Math.imul(b, 33) + c) >>> 0;
              }
              return a.toString(16) + b.toString(16);
            };
            // A repeating block: the source's own rule, starting at the first occurrence
            // that needs it, minus the occurrences that do not. Google may hand a rule
            // back reworded, so the block carries a signature of what it was built
            // from, and that is what a later run compares.
            const series = (key, master, first, skipped) => {
              const lines = master.recurrence.concat(Array.from(new Set(skipped.map(exdate))).sort());
              const b = shell(key, title(master));
              if (first.start.date) {
                b.start = { date: first.start.date };
                b.end = { date: first.end.date };
              } else {
                b.start = { dateTime: first.start.dateTime, timeZone: master.start.timeZone };
                b.end = { dateTime: first.end.dateTime, timeZone: (master.end && master.end.timeZone) || master.start.timeZone };
              }
              b.recurrence = lines;
              b.extendedProperties.private[SIG] = hash(JSON.stringify([master.start, master.end, lines]));
              return b;
            };
            // Does the block on the calendar still look the way the plan wants it? A
            // colour or reminder someone set by hand is left alone.
            const same = (have, want) => {
              if (!!have.recurrence !== !!want.recurrence) return false;
              const look = (have.summary || "") === want.summary &&
                (have.description || "") === (want.description || "") &&
                (have.transparency || "opaque") === "opaque" &&
                have.visibility === "private" &&
                (!want.colorId || have.colorId === want.colorId);
              if (want.recurrence) return look && priv(have)[SIG] === want.extendedProperties.private[SIG];
              return look && edge(have.start) === edge(want.start) && edge(have.end) === edge(want.end);
            };

            const creates = [], updates = [], deletes = [];
            const wanted = {};   // "<source> -> <target>": occurrences that should be blocked, for the log line
            let covered = 0;     // occurrences the target had already blocked itself
            let vanished = 0;    // blocks going because their source event is no longer returned
            let repeating = 0;   // repeating blocks wanted
            let adrift = 0;      // occurrences blocked but not wanted, or wanted but not blocked

            // Every event the source calendars returned, whether or not it earns a block.
            const present = new Set();
            for (const source of srcNames) {
              for (const e of srcBy[source]) if (e && e.id) present.add(source + "/" + e.id);
              for (const e of srcRawBy[source] || []) if (e && e.id) present.add(source + "/" + e.id);
            }

            for (const target of dstNames) {
              const existing = dstBy[target].filter(live);
              // Meetings the target holds itself (not declined there): no block for them.
              const held = new Set(existing.filter((e) => real(e) && !selfDeclined(e)).map(meeting).filter(Boolean));

              // Time the target already shows as busy on its own. A source event that
              // sits wholly inside one of these needs no block: you blocked it by hand,
              // or the same commitment is on both calendars as two separate events.
              const own = rules.skipAlreadyBusy ? existing.filter(busy) : [];
              const timed = own.filter((e) => e.start.dateTime)
                .map((e) => [Date.parse(e.start.dateTime), Date.parse(e.end.dateTime)]);
              const days = own.filter((e) => e.start.date).map((e) => [e.start.date, e.end.date]);
              const alreadyBusy = (e) => (e.start.dateTime
                ? timed.some(([a, b]) => a <= Date.parse(e.start.dateTime) && b >= Date.parse(e.end.dateTime))
                : days.some(([a, b]) => a <= e.start.date && b >= e.end.date));

              // Which blocks SHOULD be on this target: "<source>/<event id>" for one
              // event or occurrence, "<source>/<repeating event id>" for a repeating block.
              const want = new Map();
              const seen = new Set();
              const due = {};   // start -> occurrences that should be blocked then
              const add = (source, n) => {
                const pair = source + " -> " + target;
                wanted[pair] = (wanted[pair] || 0) + n;
              };
              const one = (source, e) => {
                const key = source + "/" + e.id;
                want.set(key, single(key, e));
                due[edge(e.start)] = (due[edge(e.start)] || 0) + 1;
                add(source, 1);
              };

              for (const source of removeAll ? [] : srcNames) {
                if (source === target) continue; // a calendar never gets a block for its own events
                const masters = new Map();   // repeating events, by id
                const dropped = new Map();   // repeating event id -> original starts of its cancelled occurrences
                for (const r of srcRawBy[source] || []) {
                  if (!r || !r.id) continue;
                  if (Array.isArray(r.recurrence) && r.recurrence.length) masters.set(r.id, r);
                  else if (r.recurringEventId && r.status === "cancelled" && r.originalStartTime) {
                    if (!dropped.has(r.recurringEventId)) dropped.set(r.recurringEventId, []);
                    dropped.get(r.recurringEventId).push(r.originalStartTime);
                  }
                }

                const runs = new Map();      // repeating event id -> its occurrences in the window
                for (const e of srcBy[source]) {
                  if (!live(e)) continue;
                  let needs = blocks(e);
                  if (needs) {
                    const m = meeting(e);
                    // The target already has this meeting itself, or another source
                    // already supplied a block for it.
                    if (m && (held.has(m) || seen.has(m))) needs = false;
                    else if (alreadyBusy(e)) { covered++; needs = false; }
                    else if (m) seen.add(m);
                  }
                  const rid = e.recurringEventId;
                  if (rid && e.originalStartTime && repeats(masters.get(rid))) {
                    if (!runs.has(rid)) runs.set(rid, []);
                    runs.get(rid).push({ e, needs });
                  } else if (needs) {
                    one(source, e);
                  }
                }

                for (const [rid, occ] of runs) {
                  const master = masters.get(rid);
                  // On the rule: where and as long as the rule puts it.
                  const onRule = (e) => edge(e.start) === edge(e.originalStartTime) && len(e) === len(master);
                  const keep = occ.filter((o) => o.needs && onRule(o.e));
                  const skip = occ.filter((o) => !(o.needs && onRule(o.e)));
                  const gone = dropped.get(rid) || [];
                  // One repeating block when most occurrences ahead need it. Otherwise
                  // the few that do get a block each.
                  if (keep.length && keep.length >= skip.length + gone.length) {
                    keep.sort((x, y) => startMs(x.e) - startMs(y.e));
                    const key = source + "/" + rid;
                    want.set(key, series(key, master, keep[0].e, skip.map((o) => o.e.originalStartTime).concat(gone)));
                    repeating++;
                    add(source, keep.length);
                    for (const o of keep) due[edge(o.e.start)] = (due[edge(o.e.start)] || 0) + 1;
                    // Moved or resized, yet still busy: a block of its own.
                    for (const o of skip) if (o.needs) one(source, o.e);
                  } else {
                    for (const o of occ) if (o.needs) one(source, o.e);
                  }
                }
              }

              // How far the calendar is from that, counted in occurrences. Non-zero
              // before a run writes; a number that stays up afterwards means a
              // repeating block is not landing where the plan expects.
              const have = {};
              for (const e of existing) if (tagOf(e)) have[edge(e.start)] = (have[edge(e.start)] || 0) + 1;
              for (const k of new Set(Object.keys(due).concat(Object.keys(have)))) {
                adrift += Math.abs((due[k] || 0) - (have[k] || 0));
              }

              // Which blocks ARE on it: this pack's events, a repeating block counted
              // once. A key seen twice is a duplicate; the first is kept, the rest go.
              const mine = (dstRawBy[target] || []).filter((e) => live(e) && tagOf(e) && !e.recurringEventId);
              const kept = new Set();
              for (const e of mine) {
                const key = tagOf(e);
                if (!want.has(key) || kept.has(key)) {
                  deletes.push({ target, event_id: e.id });
                  // Its source calendar is still bound, yet the event is gone.
                  if (!want.has(key) && !present.has(key) && srcNames.includes(key.split("/")[0])) vanished++;
                  continue;
                }
                kept.add(key);
                const w = want.get(key);
                if (!same(e, w)) updates.push({ target, event_id: e.id, event: w });
              }
              for (const [key, w] of want) {
                if (!kept.has(key)) creates.push({ target, event: w });
              }
            }

            // Blocks going because their event was cancelled, or because a source came
            // back empty. The two look alike, so a large number stops the run. Blocks
            // going for a reason the plan can see (declined, marked free, already
            // blocked on the target, source unbound) are not counted.
            if (!removeAll && vanished > maxDeletes) {
              throw new Error(
                "refusing to delete " + vanished + " blocks whose source events are gone (max_deletes is " +
                maxDeletes + "); check the source calendars read correctly, or raise max_deletes"
              );
            }
            // A run does at most `batch` of each; a for_each over more than
            // policy.max_fan_out items is refused outright. What is left over is simply
            // still missing on the next run, which plans it again.
            const left = Math.max(creates.length - batch, 0) + Math.max(updates.length - batch, 0) +
              Math.max(deletes.length - batch, 0);
            return {
              creates: creates.slice(0, batch),
              updates: updates.slice(0, batch),
              deletes: deletes.slice(0, batch),
              pending: left,
              adrift,
              summary: creates.length + " to create, " + updates.length + " to change, " + deletes.length +
                " to remove across " + dstNames.length + " target(s) from " + srcNames.length + " source(s)" +
                "; occurrences to block: " + (Object.keys(wanted).sort().map((k) => k + " " + wanted[k]).join(", ") || "none") +
                (repeating ? "; " + repeating + " repeating block(s)" : "") +
                (covered ? "; " + covered + " already blocked on the target" : "") +
                (adrift ? "; " + adrift + " occurrence(s) not yet in step" : "") +
                (removeAll ? "; remove_all is on" : "") +
                (left ? "; batch_size " + batch + ", " + left + " left for later runs" : ""),
            };
          }

          // ---------------------------------------------------------------------------
          // cleanup — retire BusyBridge's blocks from now on, keep its history
          // ---------------------------------------------------------------------------
          function untilStamp(now, allDay) {
            const p = (n) => ("0" + n).slice(-2);
            if (allDay) {
              // An all-day series' UNTIL is a DATE; end it yesterday (UTC), so nothing
              // from today on remains.
              const y = new Date(now.getTime() - 86400000);
              return "" + y.getUTCFullYear() + p(y.getUTCMonth() + 1) + p(y.getUTCDate());
            }
            return "" + now.getUTCFullYear() + p(now.getUTCMonth() + 1) + p(now.getUTCDate()) + "T" +
              p(now.getUTCHours()) + p(now.getUTCMinutes()) + p(now.getUTCSeconds()) + "Z";
          }

          function truncateRecurrence(rec, until) {
            return rec.map((line) => {
              if (!/^RRULE:/i.test(line)) return line;
              const parts = line.slice(6).split(";").filter((p) => p && !/^(UNTIL|COUNT)=/i.test(p));
              parts.push("UNTIL=" + until);
              return "RRULE:" + parts.join(";");
            });
          }

          function cleanupMode() {
            const apply = bool(cfg.cleanup_apply, false);
            const maxOps = num(cfg.cleanup_max_ops, 1000);
            const batch = num(cfg.batch_size, 50);
            const now = cfg.now ? new Date(cfg.now) : new Date();
            const nowMs = now.getTime();
            const out = { apply: apply, summary: {}, delete: [], patch: [] };
            const targets = calendars("dstraw");
            for (const target of Object.keys(targets)) {
              const evs = targets[target].filter((e) => e.status !== "cancelled" && isBusyBridge(e));
              const masters = new Map();
              for (const e of evs) if (Array.isArray(e.recurrence) && e.recurrence.length) masters.set(e.id, e);
              const del = [], patch = [];
              const doomed = new Set();
              let keptPast = 0;
              for (const m of masters.values()) {
                if (startMs(m) >= nowMs) {
                  del.push({ target: target, event_id: m.id, why: "series starts in the future" });
                  doomed.add(m.id);
                } else {
                  patch.push({ target: target, event_id: m.id, event: { recurrence: truncateRecurrence(m.recurrence, untilStamp(now, isAllDay(m))) } });
                }
              }
              for (const e of evs) {
                if (masters.has(e.id)) continue;
                if (e.recurringEventId && doomed.has(e.recurringEventId)) continue; // goes with its series
                if (startMs(e) >= nowMs) del.push({ target: target, event_id: e.id, why: e.recurringEventId ? "future exception" : "future one-off" });
                else keptPast++;
              }
              out.summary[target] = { busybridge_events: evs.length, series: masters.size, delete: del.length, end_series: patch.length, kept_past: keptPast };
              out.delete.push(...del);
              out.patch.push(...patch);
            }
            const total = out.delete.length + out.patch.length;
            if (total > maxOps) {
              throw new Error("cleanup would make " + total + " changes, over cleanup_max_ops " + maxOps + "; raise it to proceed");
            }
            // Each list is one for_each step, held under policy.max_fan_out: a big
            // cleanup takes a few runs (each run re-reads and does what is left).
            out.remaining = Math.max(0, out.delete.length - batch) + Math.max(0, out.patch.length - batch);
            out.delete = out.delete.slice(0, batch);
            out.patch = out.patch.slice(0, batch);
            if (!apply) {
              out.sample = { delete: out.delete.slice(0, 10), end_series: out.patch.slice(0, 10).map((p) => p.target + ":" + p.event_id) };
              out.delete = []; out.patch = [];
            }
            return out;
          }

          switch (mode) {
            case "plan": return planMode();
            case "cleanup": return cleanupMode();
            default: throw new Error("plan step: unknown mode " + JSON.stringify(mode));
          }

      - log: "calendar-busy-sync: {{.plan.summary}}{{if ${settings.dry_run}}} (dry run: nothing written){{end}}"

      # Writes: each op names its target calendar, and member: sends it there
      # (and only to a calendar in the targets list). Each fans out 8-wide and
      # keeps going past a failed item; `applied` fails the run at the end if
      # any did, and the next run retries.
      - { id: remove, if: "!${settings.dry_run}", for_each: "{{.plan.deletes}}", parallel: true, continue_on_error: true, progress: removing blocks,
          uses: targets.event_delete, member: "{{.item.target}}", options: { event_id: "{{.item.event_id}}" } }
      - { id: create, if: "!${settings.dry_run}", for_each: "{{.plan.creates}}", parallel: true, continue_on_error: true, progress: adding blocks,
          uses: targets.event_create, member: "{{.item.target}}", options: { event: "{{.item.event}}" } }
      - { id: move, if: "!${settings.dry_run}", for_each: "{{.plan.updates}}", parallel: true, continue_on_error: true, progress: changing blocks,
          uses: targets.event_update, member: "{{.item.target}}", options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
      - id: applied
        use: js
        code: |
          const bad = ["remove", "create", "move"].filter((k) => ctx[k] && ctx[k].failed);
          if (bad.length) throw new Error("some block writes failed, the next run retries them: " + bad.map((k) => k + ": " + ctx[k].error).join("; "));
          return { pending: ctx.plan.pending };

  backup:
    description: "Snapshot every calendar (raw API JSON, re-insertable, and ICS) into the backup connector's tiers; unchanged snapshots are skipped, each tier's retention applies."
    steps:
      - id: cfg
        set: { backup_prefix: "${settings.backup_prefix}" }
      - id: win
        use: js
        code: |
          const back = Number("${settings.backup_days_back}"), ahead = Number("${settings.backup_days_ahead}");
          const now = Date.now();
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { min: new Date(now - back * 86400000).toISOString(), max: new Date(now + ahead * 86400000).toISOString(), tiers: tiers };
      # Not expanded: a repeating event is one series, not hundreds of items.
      - parallel:
          - - { id: srcraw, uses: sources.events, over: true, parallel: true, progress: reading calendars,
                options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
          - - { id: dstraw, uses: targets.events, over: true, parallel: true,
                options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
      - id: snap
        use: js
        code: |
          // The backup snapshot step, run as a `use: js` code step body (an
          // IIFE: top-level `return` is the step's outputs).
          //
          // The calendars arrive keyed by connector name from the `over:` read steps
          // (ctx.srcraw / ctx.dstraw .by_member = { <connector>: { items } }); for each one this returns
          // two snapshots to store — the raw API JSON (lossless, re-insertable) and an
          // ICS file any calendar app can import — plus an index of every set, which
          // the restore test reads. Pure: the workflow does the I/O.

          const cfg = ctx.cfg || {};

          function calendars(id) {
            const s = ctx[id];
            const by = s && s.by_member;
            if (!by || typeof by !== "object") throw new Error("step " + id + " returned no calendars");
            const out = {};
            for (const name of Object.keys(by).sort()) {
              const r = by[name];
              const items = Array.isArray(r) ? r : r && r.items;
              if (!Array.isArray(items)) throw new Error("step " + id + ": " + name + " returned no items");
              out[name] = items;
            }
            return out;
          }

          function icsEscape(s) {
            return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
              .replace(/\r\n|\r|\n/g, "\\n");
          }
          function icsFold(line) {
            // RFC 5545 §3.1: lines over 75 octets fold with CRLF + space. Count UTF-16
            // units conservatively (≤ 74) so a multi-byte character never splits badly.
            const out = [];
            while (line.length > 74) {
              out.push(line.slice(0, 74));
              line = " " + line.slice(74);
            }
            out.push(line);
            return out.join("\r\n");
          }
          function icsTime(name, t) {
            if (t.date) return name + ";VALUE=DATE:" + t.date.replace(/-/g, "");
            const d = new Date(t.dateTime);
            const p = (n) => ("0" + n).slice(-2);
            return name + ":" + d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" +
              p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
          }
          function toICS(name, evs) {
            const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NodeSpy//calendar-busy-sync//EN", "X-WR-CALNAME:" + icsEscape(name)];
            for (const e of evs) {
              if (e.status === "cancelled" || !e.start || !e.end) continue;
              L.push("BEGIN:VEVENT");
              L.push("UID:" + icsEscape(e.iCalUID || e.id));
              if (e.recurringEventId && e.originalStartTime) L.push(icsTime("RECURRENCE-ID", e.originalStartTime));
              L.push(icsTime("DTSTART", e.start));
              L.push(icsTime("DTEND", e.end));
              if (e.updated) L.push(icsTime("DTSTAMP", { dateTime: e.updated }));
              for (const r of e.recurrence || []) L.push(r);
              if (e.summary) L.push("SUMMARY:" + icsEscape(e.summary));
              if (e.description) L.push("DESCRIPTION:" + icsEscape(e.description));
              if (e.location) L.push("LOCATION:" + icsEscape(e.location));
              if (e.status) L.push("STATUS:" + e.status.toUpperCase());
              if (e.transparency === "transparent") L.push("TRANSP:TRANSPARENT");
              L.push("END:VEVENT");
            }
            L.push("END:VCALENDAR");
            return L.map(icsFold).join("\r\n") + "\r\n";
          }
          function snapshotsMode() {
            const prefix = cfg.backup_prefix || "calendar";
            const snaps = [];
            // A calendar in both lists is read twice; it is snapshot once.
            const cal = Object.assign({}, calendars("srcraw"), calendars("dstraw"));
            for (const s of Object.keys(cal).sort()) {
              const evs = cal[s];
              const set = prefix + "-" + s.replace(/[^A-Za-z0-9._-]/g, "-");
              snaps.push({ set: set + "-json", ext: "json", text: JSON.stringify(evs) });
              snaps.push({ set: set + "-ics", ext: "ics", text: toICS(s, evs) });
            }
            // The index lists every set, so the restore test knows what to verify
            // without reading the calendars.
            const sets = snaps.map((x) => x.set);
            snaps.push({ set: prefix + "-index", ext: "json", text: JSON.stringify({ sets: sets }) });
            return { snapshots: snaps, sets: sets };
          }


          return snapshotsMode();
      - id: put
        for_each: "{{.snap.snapshots}}"
        progress: writing backups
        uses: backup.put
        options: { set: "{{.item.set}}", ext: "{{.item.ext}}", text: "{{.item.text}}", tiers: "{{.win.tiers}}" }

  verify:
    description: "Restore test: restore each set's newest snapshot from every tier and check it against its recorded sha256/size, plus the backend's own consistency check."
    steps:
      - id: names
        use: js
        code: |
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { index: "${settings.backup_prefix}-index", tiers: tiers };
      # The nightly backup writes an index of its sets; restore it first (an
      # integrity-checked read), then test every set it names.
      - id: index
        uses: backup.read
        options: { set: "{{.names.index}}" }
      - id: sets
        use: js
        code: |
          const sets = JSON.parse(ctx.index.content).sets;
          if (!Array.isArray(sets) || !sets.length) throw new Error("the index names no sets");
          return { sets: [ctx.names.index].concat(sets) };
      - id: verify
        for_each: "{{.sets.sets}}"
        progress: restore-testing backups
        continue_on_error: true
        uses: backup.verify
        options: { set: "{{.item}}", mode: both, sample: 1, tiers: "{{.names.tiers}}" }
      - id: verified
        use: js
        code: |
          if (ctx.verify.failed) throw new Error("restore test failed: " + ctx.verify.error);
          const bad = [];
          (ctx.verify.items || []).forEach((r, i) => { if (!r || r.ok !== true) bad.push(ctx.sets.sets[i]); });
          if (bad.length) throw new Error("restore test failed for: " + bad.join(", "));
          return { verified: (ctx.verify.items || []).length };

# conductor counts every run of a trigger against one target as an "attempt",
# backs off past max_attempts_per_head (3 by default) and PARKS the trigger for
# good at twice that. That suits a fixer retrying one PR; a calendar or a cron
# schedule is one target forever, so a sweep would stop after six runs. These
# triggers are meant to run indefinitely, so the threshold is lifted. One run
# at a time per trigger, and the calendar-writing triggers share one
# serialize key, so two reconciles (or a reconcile and the cleanup) never race.
x-policy:
  always: &always
    max_attempts_per_head: 1000000000
    concurrency: { max_runs: 1 }

# Every trigger ships DISARMED. Arming one in the instance block is the
# consent to what it does.
triggers:
  # Push-driven: fires seconds after a source calendar changes (the
  # connector's `changed` source; needs `watch:` on each source connector).
  - name: on_change
    "on": sources.changed
    policy: *always
    serialize: { key: calendar-busy-sync }
    steps:
      - call: reconcile

  # Push from the targets: a block deleted or moved by hand, or time that is
  # now busy there, is put right in seconds instead of at the next sweep. A
  # separate trigger, since a calendar may sit in both lists (and a push
  # source can appear only once per trigger); a calendar in both lists then
  # queues one extra reconcile per change, which finds nothing to do.
  - name: on_target_change
    "on": targets.changed
    policy: *always
    serialize: { key: calendar-busy-sync }
    steps:
      - call: reconcile

  # The backstop, and `conductor run <inst>/sweep`. Google push is best-effort
  # and nothing arrives while the daemon is down, so a periodic pass turns a
  # missed push into latency rather than a missing block. It also rolls the
  # window forward. KEEP IT ARMED.
  - name: sweep
    "on": [cron.busy_sync, manual]
    policy: *always
    serialize: { key: calendar-busy-sync }
    steps:
      - call: reconcile

  - name: backup
    "on": [cron.busy_backup, manual]
    policy: *always
    serialize: { key: calendar-busy-sync-backup }
    steps:
      - call: backup

  - name: verify
    "on": [cron.busy_verify, manual]
    policy: *always
    serialize: { key: calendar-busy-sync-backup }
    steps:
      - call: verify

  # Manual only, one-time: retire BusyBridge's own blocks on the targets.
  # `conductor run <inst>/cleanup` reports; add `--input apply=true` to make
  # the changes. Up to batch_size deletes and series-ends per run: a large
  # cleanup says how many remain, so run it again.
  - name: cleanup
    "on": manual
    serialize: { key: calendar-busy-sync }
    # Inline rather than a workflow: it reads the manual run's --input apply.
    steps:
      - id: cfg
        set:
          mode: cleanup
          cleanup_apply: "{{.inputs.apply}}"
          cleanup_max_ops: "${settings.cleanup_max_ops}"
          batch_size: "${settings.batch_size}"
      - id: win
        use: js
        code: "return { min: new Date().toISOString() };"
      # Not expanded: a repeating series is one master (whose RRULE gets an
      # UNTIL) plus its exceptions, not hundreds of instances.
      - { id: dstraw, uses: targets.events, over: true, parallel: true,
          options: { timeMin: "{{.win.min}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
      - id: plan
        use: js
        code: *busy_js
      - log: "busybridge cleanup: {{.plan.summary}}{{if not .plan.apply}} (report only — run again with --input apply=true to make these changes; sample: {{.plan.sample}}){{end}}{{if .plan.remaining}} — {{.plan.remaining}} more after this run; run cleanup again{{end}}"
      - { id: cleanup_delete, for_each: "{{.plan.delete}}", parallel: true, continue_on_error: true,
          uses: targets.event_delete, member: "{{.item.target}}", options: { event_id: "{{.item.event_id}}" } }
      - { id: cleanup_end, for_each: "{{.plan.patch}}", parallel: true, continue_on_error: true,
          uses: targets.event_update, member: "{{.item.target}}", options: { event_id: "{{.item.event_id}}", event: "{{.item.event}}" } }
      - id: applied
        use: js
        code: |
          const bad = ["cleanup_delete", "cleanup_end"].filter((k) => ctx[k] && ctx[k].failed);
          if (bad.length) throw new Error("some cleanup writes failed (run cleanup again; it only touches what is left): " + bad.map((k) => k + ": " + ctx[k].error).join("; "));
          return { ok: true };
