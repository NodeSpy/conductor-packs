# calendar-backup — a distributable conductor pack.
#
# Nightly snapshots of any number of Google calendars into a backup
# connector's tiers, and a weekly restore test. Per calendar, two snapshots:
# the raw API JSON (lossless, re-insertable through the API) and an ICS file
# any calendar app imports; plus an index of every set, which the restore
# test reads. Unchanged snapshots are skipped; each tier's retention applies.
#
# Pure verbs + one js step — no agent, no model, no cost. Read-only on the
# calendars: it never writes to them.
#
# Install (in your config's `packs:` block):
#   packs:
#     calbak:
#       source: github.com/NodeSpy/conductor-packs//calendar-backup
#       version: "~> 1.0"
#       connectors:
#         calendars: [cal-personal, cal-work, cal-side]
#         cron: timer              # schedules busy_backup + busy_verify
#         backup: calbackup        # a `backup` connector and its tiers
#       triggers:
#         backup: { enabled: true }
#         verify: { enabled: true }

pack:
  name: calendar-backup
  version: 1.0.0
  description: Nightly JSON + ICS snapshots of any number of Google calendars into a backup connector's tiers, with a weekly restore test. Read-only on the calendars. Pure verbs, no agent.
  tags: [calendar, google-calendar, backup]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # >=0.106.0: list sockets (`many: true`) and `over:` steps.
    conductor: ">=0.106.0"
    connectors:
      # google-calendar >=1.2.0: `events` follows every result page.
      calendars: { many: true, type: google-calendar, version: ">=1.2.0" }
      # Your cron connector must declare `busy_backup` and `busy_verify`.
      cron: "*"
      backup: ">=1.0.0"

settings:
  backup_tiers:
    type: string
    default: ""
    desc: "Comma-separated backup tiers to write and verify. Empty: every tier of the bound backup connector."
  backup_prefix:
    type: string
    default: calendar
    desc: "Set names are <prefix>-<connector>-json / -ics (e.g. calendar-cal-work-ics), plus <prefix>-index."
  backup_days_back:
    type: integer
    default: 365
    desc: "The backup covers events from this many days ago..."
  backup_days_ahead:
    type: integer
    default: 730
    desc: "...to this many days ahead (repeating events are kept as one series)."

workflows:
  backup:
    description: "Snapshot every calendar (raw API JSON, re-insertable, and ICS) into the backup connector's tiers; unchanged snapshots are skipped, each tier's retention applies."
    steps:
      - id: cfg
        set: { backup_prefix: "${settings.backup_prefix}" }
      - id: win
        use: js
        code: |
          const back = Number("${settings.backup_days_back}"), ahead = Number("${settings.backup_days_ahead}");
          const now = Date.now();
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { min: new Date(now - back * 86400000).toISOString(), max: new Date(now + ahead * 86400000).toISOString(), tiers: tiers };
      # Not expanded: a repeating event is one series, not hundreds of items.
      - { id: read, uses: calendars.events, over: true, parallel: true, progress: reading calendars,
          options: { timeMin: "{{.win.min}}", timeMax: "{{.win.max}}", singleEvents: false, maxResults: 2500, max_pages: 200 } }
      - id: snap
        use: js
        code: &snapshots_js |
          // calendar-backup — the snapshot step, run as a `use: js` code step body (an
          // IIFE: top-level `return` is the step's outputs).
          //
          // The calendars arrive keyed by connector name from the `over:` read step
          // (ctx.read.by_member = { <connector>: { items } }); for each one this returns
          // two snapshots to store — the raw API JSON (lossless, re-insertable) and an
          // ICS file any calendar app can import — plus an index of every set, which
          // the restore test reads. Pure: the workflow does the I/O.

          const cfg = ctx.cfg || {};

          function calendars(id) {
            const s = ctx[id];
            const by = s && s.by_member;
            if (!by || typeof by !== "object") throw new Error("step " + id + " returned no calendars");
            const out = {};
            for (const name of Object.keys(by).sort()) {
              const r = by[name];
              const items = Array.isArray(r) ? r : r && r.items;
              if (!Array.isArray(items)) throw new Error("step " + id + ": " + name + " returned no items");
              out[name] = items;
            }
            return out;
          }

          function icsEscape(s) {
            return String(s).replace(/\\/g, "\\\\").replace(/;/g, "\\;").replace(/,/g, "\\,")
              .replace(/\r\n|\r|\n/g, "\\n");
          }
          function icsFold(line) {
            // RFC 5545 §3.1: lines over 75 octets fold with CRLF + space. Count UTF-16
            // units conservatively (≤ 74) so a multi-byte character never splits badly.
            const out = [];
            while (line.length > 74) {
              out.push(line.slice(0, 74));
              line = " " + line.slice(74);
            }
            out.push(line);
            return out.join("\r\n");
          }
          function icsTime(name, t) {
            if (t.date) return name + ";VALUE=DATE:" + t.date.replace(/-/g, "");
            const d = new Date(t.dateTime);
            const p = (n) => ("0" + n).slice(-2);
            return name + ":" + d.getUTCFullYear() + p(d.getUTCMonth() + 1) + p(d.getUTCDate()) + "T" +
              p(d.getUTCHours()) + p(d.getUTCMinutes()) + p(d.getUTCSeconds()) + "Z";
          }
          function toICS(name, evs) {
            const L = ["BEGIN:VCALENDAR", "VERSION:2.0", "PRODID:-//NodeSpy//calendar-busy-sync//EN", "X-WR-CALNAME:" + icsEscape(name)];
            for (const e of evs) {
              if (e.status === "cancelled" || !e.start || !e.end) continue;
              L.push("BEGIN:VEVENT");
              L.push("UID:" + icsEscape(e.iCalUID || e.id));
              if (e.recurringEventId && e.originalStartTime) L.push(icsTime("RECURRENCE-ID", e.originalStartTime));
              L.push(icsTime("DTSTART", e.start));
              L.push(icsTime("DTEND", e.end));
              if (e.updated) L.push(icsTime("DTSTAMP", { dateTime: e.updated }));
              for (const r of e.recurrence || []) L.push(r);
              if (e.summary) L.push("SUMMARY:" + icsEscape(e.summary));
              if (e.description) L.push("DESCRIPTION:" + icsEscape(e.description));
              if (e.location) L.push("LOCATION:" + icsEscape(e.location));
              if (e.status) L.push("STATUS:" + e.status.toUpperCase());
              if (e.transparency === "transparent") L.push("TRANSP:TRANSPARENT");
              L.push("END:VEVENT");
            }
            L.push("END:VCALENDAR");
            return L.map(icsFold).join("\r\n") + "\r\n";
          }
          function snapshotsMode() {
            const prefix = cfg.backup_prefix || "calendar";
            const snaps = [];
            const cal = calendars("read");
            for (const s of Object.keys(cal).sort()) {
              const evs = cal[s];
              const set = prefix + "-" + s.replace(/[^A-Za-z0-9._-]/g, "-");
              snaps.push({ set: set + "-json", ext: "json", text: JSON.stringify(evs) });
              snaps.push({ set: set + "-ics", ext: "ics", text: toICS(s, evs) });
            }
            // The index lists every set, so the restore test knows what to verify
            // without reading the calendars.
            const sets = snaps.map((x) => x.set);
            snaps.push({ set: prefix + "-index", ext: "json", text: JSON.stringify({ sets: sets }) });
            return { snapshots: snaps, sets: sets };
          }


          return snapshotsMode();
      - id: put
        for_each: "{{.snap.snapshots}}"
        progress: writing backups
        uses: backup.put
        options: { set: "{{.item.set}}", ext: "{{.item.ext}}", text: "{{.item.text}}", tiers: "{{.win.tiers}}" }

  verify:
    description: "Restore test: restore each set's newest snapshot from every tier and check it against its recorded sha256/size, plus the backend's own consistency check."
    steps:
      - id: names
        use: js
        code: |
          const tiers = "${settings.backup_tiers}".split(",").map((s) => s.trim()).filter(Boolean);
          return { index: "${settings.backup_prefix}-index", tiers: tiers };
      # The nightly backup writes an index of its sets; restore it first (an
      # integrity-checked read), then test every set it names.
      - id: index
        uses: backup.read
        options: { set: "{{.names.index}}" }
      - id: sets
        use: js
        code: |
          const sets = JSON.parse(ctx.index.content).sets;
          if (!Array.isArray(sets) || !sets.length) throw new Error("the index names no sets");
          return { sets: [ctx.names.index].concat(sets) };
      - id: verify
        for_each: "{{.sets.sets}}"
        progress: restore-testing backups
        continue_on_error: true
        uses: backup.verify
        options: { set: "{{.item}}", mode: both, sample: 1, tiers: "{{.names.tiers}}" }
      - id: verified
        use: js
        code: |
          if (ctx.verify.failed) throw new Error("restore test failed: " + ctx.verify.error);
          const bad = [];
          (ctx.verify.items || []).forEach((r, i) => { if (!r || r.ok !== true) bad.push(ctx.sets.sets[i]); });
          if (bad.length) throw new Error("restore test failed for: " + bad.join(", "));
          return { verified: (ctx.verify.items || []).length };

# conductor counts every run of a trigger against one target as an "attempt"
# and parks a trigger past twice max_attempts_per_head (3 by default) — a cron
# schedule is one target forever, so a nightly backup would stop after six
# nights. Lifted here; one run at a time, and verify never overlaps backup.
x-policy:
  always: &always
    max_attempts_per_head: 1000000000
    concurrency: { max_runs: 1 }

# Both ship DISARMED.
triggers:
  - name: backup
    "on": [cron.busy_backup, manual]
    policy: *always
    serialize: { key: calendar-backup }
    steps:
      - call: backup

  - name: verify
    "on": [cron.busy_verify, manual]
    policy: *always
    serialize: { key: calendar-backup }
    steps:
      - call: verify
