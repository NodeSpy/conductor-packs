# A bots: entry for an SRE bot using this pack — copy it into your config
# and bind it to YOUR environment. Names here are placeholders ("platform-sre",
# connector names "pd", "aws", "tf-plan", "tf-apply", "slack"): use your own.
#
# Requires the conductor release with bots (not tagged yet — see README),
# operators: with your SSH public key, and a `use: cli` runtime for workers.

operators:
  you:
    ssh_key: "ssh-ed25519 AAAA… you@laptop"     # approvals are SSH-signed with this key
    aliases: ["slack:U0000000"]                   # your chat id, so your chat requests count as yours

bots:
  platform-sre:
    description: "first-line SRE for the platform services"
    charter_file: .conductor/packs/platform-sre/charter.md   # the vendored pack's charter
    seed_dir: .conductor/packs/platform-sre                  # first start: copy the pack's typed runbooks/ + watch/ into memory
    collections:                                             # a custom document kind, shipped by the pack
      postmortems: { from: .conductor/packs/platform-sre/collections/postmortems.yaml }
    escalation: |
      Escalate to the operator when: a sev1 is not mitigated within 15 minutes;
      any data loss is suspected; you are below 70% confident in the cause.
    home:
      rotate: { max_age: 24h, max_turns: 100 }
    worker:
      runtime: claude-cli                          # a `use: cli` runtime
      timeout: 2h
    skill:
      verbs:
        - pd.get_incident
        - pd.list_incidents
        - pd.acknowledge
        - pd.add_note
        - pd.resolve
        - pd.escalate
        - aws.*                                    # the aws-cost connector
        - slack.post
        # - git.push                               # once released: how the bot pushes its Terraform branch
        # No terraform verbs: conductor plans and applies (terraform: below).
        # A verb that could reach the apply connector is a config error.
    autonomy:
      shadow: true                                 # start here; review the shadow proposals; then promote
      tiers:
        observe:
          - pd.get_incident
          - pd.list_incidents
          - aws.cost_*
          - aws.reservation_*
          - aws.savings_plans*
          - aws.reserved_*
        reversible: [pd.acknowledge, pd.add_note]
        propose:    [pd.resolve, pd.escalate, slack.post, terraform.apply]
        commit_money: [aws.purchase_*]
      promote: [pd.acknowledge, pd.add_note]       # takes effect once bot sessions are sandboxed
      amounts:
        aws.purchase_savings_plan: total_commitment_usd
        aws.purchase_reserved_instances: total_cost_usd
      spend_cap: { per_action: 2000, per_period: 5000, period: 720h, currency: USD }
      approval_ttl: 24h
    # Proactive sweeps — OFF until you uncomment this. Each sweep is a read-only
    # worker (the gate holds it to observe-tier verbs; any write becomes a
    # proposal) that works through the charter's "Proactive checks" and
    # the watch/ documents, and tells you only about findings at notify_at or above.
    # proactive:
    #   every: 4h
    #   quiet_hours: "22:00-07:00"
    #   # timezone: Europe/Berlin
    #   budget: { max_runs_per_day: 6, max_cost_per_day: 2.00 }
    #   checklist: { section: "Proactive checks" }
    #   notify_at: high
    terraform:                                     # conductor plans and applies; the bot proposes commits
      plan_connector: tf-plan                      # a `use: terraform` connector whose env is a READ role
      apply_connector: tf-apply                    # its env is the WRITE role; only conductor uses it
      repos: { infra: git@git.example.com:platform/infra.git }
      # allow_destroy: []                          # stateful destroys/replaces are refused unless named here

# ---------------------------------------------------------------------------
# A TEAM — OFF until you uncomment it. Teams are yours to cut (by system,
# function, environment); conductor has no org. The team's settings are
# CEILINGS its bots inherit and can only narrow (a bot past its team's is
# a load error naming both values). Teammates may `conductor bot ask` each
# other (data only) and `conductor bot delegate` work to each other (worked
# under the recipient's own authority, at the original request's trust); the
# team shares a knowledge repo bots PROPOSE promotions into (and you can edit
# directly: `conductor bot knowledge …`); and a trigger can route to the team
# instead of one bot.
#
# Here: a lead that triages, and two bots that work the cases. Each bot
# block is the platform-sre entry above with its own name, description, scope
# and memory — copy what you need. The bots inherit what they leave unset.
#
# teams:
#   platform:
#     description: "SRE for the platform services"
#     # folder: …                              # display only (`conductor bot ls`), your choice; no behavior
#     # delegation: { max_depth: 3 }           # most hops a delegation chain may take (default 3)
#     operators: [you]                         # who approves for the team (bots' operators fit inside)
#     autonomy:
#       ceiling: reversible                    # or observe: no bot promotes anything
#       shadow: true                           # every bot calibrates first
#     budget:
#       spend_cap: { per_action: 2000, per_period: 5000, period: 720h, currency: USD }
#       proactive: { max_runs_per_day: 8, max_cost_per_day: 3.00 }   # one pool for all bots' sweeps
#     isolation: { handoff_workers: false }    # cli workers only; sandbox: required once the agent sandbox is on
#     knowledge: { promotion: proposal }       # shared runbooks/knowledge; an operator approves each promotion
#     routing:
#       rules:                                 # deterministic, first match wins, no model
#         - name: data-stores
#           match: { source: "pd.*", "pagerduty.service": "db-*" }   # any event field, globs
#           to: platform-data
#         - name: cost
#           match: { title: "*spend*" }
#           to: platform-sre
#       lead: platform-lead                    # anything else: the lead triages (read-only) and assigns
#       fallback: platform-sre                 # no rule, no assignment within timeout: → here
#       # timeout: 10m
#
# bots:
#   platform-lead:
#     team: platform
#     description: "triage lead for the platform team: routes work, works little itself"
#     scope: "Decide who handles a routed event; keep runbooks/triage.md current."
#     charter_file: .conductor/packs/platform-sre/charter.md
#     worker: { runtime: claude-cli }
#     skill: { verbs: [pd.get_incident, pd.list_incidents] }        # reads only: triage
#     autonomy: { tiers: { observe: [pd.get_incident, pd.list_incidents] } }
#   platform-sre:
#     team: platform
#     description: "first-line SRE for the platform services"
#     scope: "Compute, deploys, networking, spend."
#     # …the platform-sre entry above, minus what the team sets
#   platform-data:
#     team: platform
#     description: "SRE for the platform's data stores"
#     scope: "Databases, caches, queues, backups."
#     charter_file: .conductor/packs/platform-sre/charter.md
#     worker: { runtime: claude-cli }
#     skill: { verbs: [pd.get_incident, pd.acknowledge, pd.add_note, aws.*] }
#     autonomy:
#       tiers: { observe: [pd.get_incident, aws.cost_*], reversible: [pd.acknowledge, pd.add_note] }
#       spend_cap: { per_action: 500, per_period: 1000, period: 720h }   # narrower than the team: fine
#
# Route to the team from a trigger in YOUR config (the pack's own triggers name
# one bot — settings.bot):
#
# triggers:
#   - on: pd.incident
#     steps:
