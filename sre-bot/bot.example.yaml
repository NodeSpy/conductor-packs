#     knowledge: { promotion: proposal }
#     routing:
#       rules:
#         - { name: data-stores, match: { source: "pd.*", "pagerduty.service": "db-*" }, to: platform-data }
#       fallback: platform-sre
# bots:
#   platform-sre:  { team: platform, … }   # a team bot is filed under its team, not the pack
