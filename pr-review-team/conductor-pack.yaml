# pr-review-team — a distributable conductor pack.
#
# Multi-lens PR review with an optional human hand-off. On a review request it
# runs a panel of lens reviewers in parallel, refute-verifies every finding,
# reconciles them deterministically into one ReviewRecord, then either
# auto-posts the review or hands the DRAFT to a human to approve/edit/post.
# With `settings: { auto: true }` it never hands off: every review posts.
#
# The hand-off is REACTIVE: while it waits for you it watches the PR and bails
# if the reason went away (merged/closed upstream, or approved elsewhere),
# re-reviews from scratch when new commits are pushed, and an idle_timeout
# reclaims a hand-off nobody closed — so stale drafts and lingering workspaces
# don't pile up.
#
# The reviewer LEARNS through memory: the lens panel reads reviewer-wide
# entries plus this repo's facts, standard and emphasis entries, and two
# disarmed triggers (review-calibration, review-backfill) write those entries
# from what happened after past reviews. See the README.
#
# Define-behavior / bind-environment: this pack ships only BEHAVIOR (workflows
# and disarmed triggers). It carries NO connectors and NO secrets — you bind
# your github connector in the `packs:` block. Posting uses that connector's
# own write identity, so no broker secret is required.
#
# Install (in your config's `packs:` block):
#   packs:
#     review:
#       source: github.com/NodeSpy/conductor-packs//pr-review-team   # or a local path
#       version: "~> 3.0"
#       # No preset/connectors needed: the sole github connector auto-binds, and the
#       # heavy/light fleets resolve against whatever your runtime offers. Pin a tier
#       # only if you want to: models: { heavy: ["claude-opus-*"], light: ["claude-sonnet-*"] }
#       # settings: { auto: true }                        # never hand off; always post
#       triggers:
#         on_review_request:
#           enabled: true                                 # arm it
#           repos:   [your-org/app]                       # scope it — a github trigger MUST name repos
#   Then: `conductor init` (vendor + lock), `conductor pack plan`, `conductor validate`.

pack:
  name: pr-review-team
  version: 3.0.0
  description: Multi-lens PR review (correctness / security / design …) with refute-verify, deterministic reconcile, an optional human hand-off, and calibration that learns per-repo memory from past reviews.
  tags: [review, github, code-quality, agents, memory]
  homepage: https://github.com/NodeSpy/conductor-packs
  license: Apache-2.0
  requires:
    # The daemon versions this pack supports. 0.69.0 is the floor for 3.0:
    # `${repo}` expands inside a memory scope string (`standard:${repo}`) and
    # a step's `memory: { extra_scopes: [...] }` appends to the default
    # scopes instead of replacing them — the per-repo layering the lens panel
    # reads. (A superset of the older floors: 0.57.0 for whole-PR review —
    # the `checkout: checkout-pr` workspace jail and `github.pr_files`
    # patches — 0.54.0 for `decide:` steps, and 0.33.0 for the reactive
    # hand-off surface.)
    conductor: ">=0.69.0"
    # Bind-only environment the pack needs — you wire this; the pack never
    # ships it.
    # requires.connectors is the pack's CAPABILITY BOUNDARY as well as its
    # socket list: the pack's skill.verbs may name no connector outside it,
    # and its wildcards are bounded to it.
    connectors:
      github: "*"
      # Built-in, binds to itself: assess reads emphasis entries, and the
      # calibration triggers read existing entries and write new ones — all
      # through the js code binding (ctx.memory), so a config without a
      # memory: section still loads.
      memory: "*"

# Every setting is substituted as TEXT (`${settings.NAME}`), so the pack
# compares them as strings ("14") wherever it reads one. `auto` is the
# exception: review-flow's first step (`automode`) normalizes it once and
# fails the run on a value it can't read; everything else reads that step.
settings:
  auto:
    type: boolean
    default: false
    desc: "true/yes/1 (any case) = never hand off: every review posts with the team's verdict (APPROVE or REQUEST_CHANGES), and emphasis entries only sharpen the review. false = assess may route a PR to a human hand-off, and a PR matching an emphasis entry leans to that hand-off. Any other value fails the review run."
  state_dir:
    type: string
    default: ""
    desc: "conductor's state directory, for the calibration triggers (empty = $XDG_STATE_HOME/conductor, else ~/.local/state/conductor). Calibration keeps its own files under <state_dir>/pr-review-team/."
  audit_log:
    type: string
    default: ""
    desc: "the audit log calibration reads reviews from (empty = <state_dir>/audit.jsonl; its rotated .1 is read too). Set it if your config moves store.audit_log."
  git_base:
    type: string
    default: "https://github.com"
    desc: "where calibration clones reviewed repos from (<git_base>/<owner>/<repo>.git); https clones authenticate through the gh CLI's login"
  calibration_window_days:
    type: string
    default: "14"
    desc: "how long after a reviewed PR merges a later commit that changes its lines counts as a follow-up"
  calibration_bootstrap_days:
    type: string
    default: "30"
    desc: "the first calibration run looks back this far"
  calibration_unmerged_days:
    type: string
    default: "30"
    desc: "stop waiting for a reviewed PR to merge after this many days"
  calibration_discard_days:
    type: string
    default: "7"
    desc: "a hand-off draft nobody posted within this many days counts as discarded"
  calibration_min_lines:
    type: string
    default: "3"
    desc: "a later commit is a follow-up only if it changes or removes at least this many lines the reviewed PR added"
  calibration_team_pages:
    type: string
    default: "15"
    desc: "pages (100 each) of teammates' review comments read per repo per calibration run"
  backfill_max_pages:
    type: string
    default: "300"
    desc: "pages (100 each) of review comments read per repo by review-backfill"
  backfill_min_chars:
    type: string
    default: "40"
    desc: "review-backfill ignores comments shorter than this"
  backfill_reviewer_since:
    type: string
    default: ""
    desc: "review-backfill: your own comments from this date (YYYY-MM-DD) on may have been posted by this pack, so they are not counted as yours (empty = the first review this pack posted, from the audit log)"

# MODEL TIERS as fleets. conductor resolves each against your runtime's roster
# best-first (see the models:/fleets model), so the pack ships NO presets and NO
# per-provider model ids — a fleet is provider-agnostic and lands on the
# strongest thing you actually run. Override a tier per-instance with
# `packs.<name>.models: { heavy: [...], light: [...] }`; otherwise these apply.
models:
  heavy:   # the lens reviewers — the strongest pass available
    any: ["claude-opus-*", "gpt-5-pro", "gpt-5.*", "o3*", "gemini-*-pro"]
  light:   # triage, refute-verify, and the hand-off agent — capable but cheaper
    any: ["claude-sonnet-*", "gpt-5", "gpt-5-mini", "gemini-*-flash", "gemini-*-pro"]

# The public surface consumers may reference by qualified name. Everything else
# is an internal implementation detail the author can refactor freely. Step
# exports are REFERENCES — <workflow>/<step-id>, the same address a consumer
# writes to override one.
exports:
  workflows: [review-flow, review-team]
  steps:
    - review-team/review
    - review-flow/assess
    - review-flow/handoff

# ---- Behavior the pack ships (namespaced under the instance name) ----
#
# There is no top-level steps: section. A step lives in the workflow that runs
# it, and config shared between steps is parked under a top-level `x-` key —
# the loader ignores those (the docker-compose extension-field convention).
# Anchors are file-local, so this house style stays inside the pack.
#
# Two ways to pull one in, both used below:
#   <<: *base       plain YAML. Dumb override — a copy of the base.
#   extends: *base  conductor's merge. Lists append, guidance STACKS.
x-templates:
  # Every agent in this pack reads PR context and writes a judgement; none of
  # them pushes anything, so none needs write access — the lens reviewers get
  # a checkout (see `panelist` below) to READ the tree, not to change it.
  house: &house
    type: agent
    checkout: none
    # Ride out a transient runtime blip (e.g. the paseo daemon restarting) rather
    # than failing the whole review: retry a failed step up to 6 times, 30s apart
    # (~3 min). Applies to every agent step that inherits house — the panelists
    # and the interactive handoff (whose worktree clone is the step most exposed
    # to a daemon-not-running error); the decide steps (assess, verify) set the
    # same policy themselves. Retries on any error; a genuine failure just
    # surfaces after the bounded attempts.
    retry: { max: 6, backoff: 30s }
    guidance: "Review only what the PR changes. Be concrete and cite file:line. Silence beats a not-worth-it comment."

  # The lens panel: the strongest pass, one instance per lens.
  panelist: &panelist
    <<: *house
    model: heavy
    mode: auto
    workspace: worktree

  # ---- Calibration building blocks (review-calibration, review-backfill) ----
  #
  # The deterministic half runs in scripts/calibration.py, shipped with the
  # pack. It needs the network (gh, git) and conductor's state directory, so
  # these steps are confined like every pack code step until you grant them
  # (`trust: full` in your packs: block — see the README). The agents get the
  # collected evidence inline and need neither: they never touch the network,
  # a clone, or the memory directory.
  calib_script: &calib_script
    use: cli
    command: [python3]
    code: "file:${pack.dir}/scripts/calibration.py"
    env: &calib_env
      STATE_DIR: "${settings.state_dir}"
      AUDIT_LOG: "${settings.audit_log}"
      GIT_BASE: "${settings.git_base}"

  # What an agent proposes. One entry per lesson, classified by where it
  # belongs; `none` is a candidate it considered and dropped (logged, never
  # written).
  learned_schema: &learned_schema
    type: object
    required: [entries, summary]
    properties:
      entries:
        type: array
        items:
          type: object
          required: [repo, kind, text, evidence]
          properties:
            repo: { type: string, description: "owner/name the lesson is about; for kind global, the repo it was learned on (global needs evidence from two or more repos)" }
            kind: { type: string, enum: [fact, standard, emphasis, global, none] }
            text: { type: string, description: "one or two plain sentences, naming the PR it came from" }
            evidence: { type: array, items: { type: string }, description: "PR refs, owner/name#N" }
            team: { type: boolean, description: "learned from teammates' comments rather than your own" }
            supersedes: { type: string, description: "id of an existing entry this one replaces (same repo and kind)" }
      summary: { type: string, description: "what was written, dropped and why — one line each" }

  # Every memory entry the reviewer reads for this run's repos, minus
  # outcome notes (not lessons). Read and written through the code binding
  # rather than the memory.* verbs: a verb step needs a memory: section for
  # the CONFIG to load, and these triggers ship in every install, armed or
  # not — so without memory the pack still loads and only calibration
  # fails, here, saying why.
  known: &known
    id: known
    run: js
    code: |
      let all;
      try {
        all = ctx.memory.recall({ limit: 0 }) || [];
      } catch (e) {
        throw new Error("calibration writes conductor memory — add a top-level memory: section (" + e + ")");
      }
      const repos = (ctx.collect && ctx.collect.repos) || [];
      const want = { global: 1 };
      for (const r of repos) { want[r] = 1; want["standard:" + r] = 1; want["emphasis:" + r] = 1; }
      const list = [];
      for (const m of all) {
        const tags = m.tags || [];
        if (!want[m.scope || "global"] || tags.indexOf("outcome") >= 0) continue;
        list.push({ id: m.id, scope: m.scope || "global", text: String(m.text || "").slice(0, 400) });
        if (list.length >= 400) break;
      }
      const text = list.map(function (m) { return "- " + m.id + " [" + m.scope + "] " + m.text.replace(/\n/g, " "); }).join("\n");
      return { list: list, text: text || "(none yet)" };

  # The repos' own convention files, so a lesson already written down there
  # is not written again.
  repodocs: &repodocs
    id: repodocs
    run: js
    code: |
      const repos = (ctx.collect && ctx.collect.repos) || [];
      const MAX = 6000;
      const pick = function (step, i) {
        const it = ctx[step] && ctx[step].items && ctx[step].items[i];
        return (it && it.text) ? String(it.text).slice(0, MAX) : "";
      };
      const out = [];
      for (let i = 0; i < repos.length; i++) {
        const parts = [["CLAUDE.md", pick("doc_claude", i)], ["AGENTS.md", pick("doc_agents", i)], ["CONTRIBUTING.md", pick("doc_contributing", i)]]
          .filter(function (p) { return p[1]; })
          .map(function (p) { return "### " + repos[i] + " " + p[0] + "\n" + p[1]; });
        if (parts.length) out.push(parts.join("\n\n"));
      }
      return { text: out.join("\n\n") || "(none)" };
  doc_claude: &doc_claude
    id: doc_claude
    uses: github.file
    for_each: "{{.collect.repos}}"
    continue_on_error: true
    options: { repo: "{{.item}}", path: CLAUDE.md, optional: true }
  doc_agents: &doc_agents
    id: doc_agents
    uses: github.file
    for_each: "{{.collect.repos}}"
    continue_on_error: true
    options: { repo: "{{.item}}", path: AGENTS.md, optional: true }
  doc_contributing: &doc_contributing
    id: doc_contributing
    uses: github.file
    for_each: "{{.collect.repos}}"
    continue_on_error: true
    options: { repo: "{{.item}}", path: CONTRIBUTING.md, optional: true }

  # The WRITE RESTRICTION. Every proposed entry is checked before anything is
  # written: its repo must be one this run collected evidence for, and its
  # evidence must cite that repo. The scope is derived from kind + repo here,
  # never taken from the agent:
  #   fact      -> <owner/repo>          (the scope the lens panel reads as "this repo")
  #   standard  -> standard:<owner/repo>
  #   emphasis  -> emphasis:<owner/repo>
  #   global    -> the shared set        (reviewer-wide) — ONLY when the
  #                evidence cites PRs from at least two distinct repos in this
  #                run. One repo's evidence never reaches every other repo's
  #                review: a global entry resting on one repo is downgraded to
  #                standard:<that repo>, and the downgrade is logged.
  # Anything else is rejected and logged. `supersedes` is honored only for an
  # existing entry in the very scope being written.
  plan: &plan
    id: plan
    run: js
    code: |
      const src = ctx.calibrate || ctx.merge || {};
      const entries = src.entries || [];
      const allowed = {};
      for (const r of ((ctx.collect && ctx.collect.repos) || [])) allowed[r] = 1;
      const archived = {};
      for (const id of ((ctx.archive && ctx.archive.ids) || [])) archived[id] = 1;
      const known = ((ctx.known && ctx.known.list) || []).filter(function (m) { return !archived[m.id]; });
      const byId = {}; const seenText = {};
      for (const m of known) { byId[m.id] = m; seenText[m.scope + "\u0000" + m.text.trim()] = 1; }
      const origin = ctx.calibrate ? "calibration" : "backfill";
      const repoOf = function (ref) { const m = /^([A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+)#\d+$/.exec(String(ref || "").trim()); return m ? m[1] : ""; };
      const writes = [], forget = [], rejected = [], dropped = [], superseded = [], downgraded = [];
      for (const e of entries) {
        const text = String(e.text || "").trim();
        let repo = String(e.repo || "").trim();
        let kind = String(e.kind || "");
        const ev = (e.evidence || []).map(repoOf);
        if (kind === "none") { dropped.push((repo || "?") + ": " + text); continue; }
        if (!text || text.length > 800) { rejected.push(kind + " " + repo + ": empty or over 800 chars"); continue; }
        if (!allowed[repo]) { rejected.push(kind + " " + repo + ": not a repo this run collected evidence for — " + text); continue; }
        if (ev.length === 0 || ev.some(function (r) { return !allowed[r]; })) { rejected.push(kind + " " + repo + ": evidence must cite PRs in this run's repos — " + text); continue; }
        if (kind === "global") {
          const cited = ev.filter(function (r, i) { return ev.indexOf(r) === i; });
          if (cited.length < 2) {
            downgraded.push("global -> standard:" + cited[0] + " (evidence from one repo only) — " + text);
            kind = "standard"; repo = cited[0];
          }
        }
        let scope, label;
        if (kind === "fact") { scope = repo; label = repo; }
        else if (kind === "standard") { scope = "standard:" + repo; label = scope; }
        else if (kind === "emphasis") { scope = "emphasis:" + repo; label = scope; }
        else if (kind === "global") { scope = ""; label = "global"; }
        else { rejected.push(kind + " " + repo + ": unknown kind — " + text); continue; }
        if (kind !== "global" && ev.indexOf(repo) < 0) { rejected.push(kind + " " + repo + ": evidence does not cite " + repo + " — " + text); continue; }
        if (seenText[label + "\u0000" + text]) { dropped.push(label + ": already recorded — " + text); continue; }
        const tags = ["review-tuning", origin, kind === "global" ? "standard" : kind];
        if (e.team) tags.push("team");
        writes.push({ scope: scope, label: label, text: text, tags: tags });
        if (e.supersedes) {
          const old = byId[e.supersedes];
          if (old && old.scope === label) { forget.push(old.id); superseded.push(old.id + " [" + label + "] " + old.text); }
          else rejected.push("supersedes " + e.supersedes + ": not an existing entry in " + label + " (kept)");
        }
      }
      return { writes: writes, forget: forget, rejected: rejected, dropped: dropped, superseded: superseded,
               downgraded: downgraded, count: writes.length };
  # The writes themselves, by the pack's own step: one memory.remember per
  # planned entry (the shared set is written with an empty scope, which is
  # how a config-authored write reaches it), then the superseded entries are
  # forgotten.
  write: &write
    id: write
    if: "plan.count > 0"
    run: js
    code: |
      const plan = ctx.plan || {};
      const items = [];
      for (const w of (plan.writes || [])) {
        const e = ctx.memory.remember(w.text, w.tags, w.scope);
        items.push({ id: e.id, scope: e.scope });
      }
      let forgotten = 0;
      for (const id of (plan.forget || [])) {
        if (ctx.memory.forget(id)) forgotten++;
      }
      return { items: items, count: items.length, forgotten: forgotten };

  # A FRESH train (review-backfill --input fresh=true). Read once, like auto:
  # true/yes/1 or false/no/0 (empty = false); anything else fails the run
  # before any agent starts.
  fresh: &fresh
    id: fresh
    run: js
    code: |
      const raw = String((ctx.inputs && ctx.inputs.fresh) == null ? "" : ctx.inputs.fresh);
      const v = raw.trim().toLowerCase();
      if (v === "" || v === "false" || v === "no" || v === "0") return { on: false };
      if (v === "true" || v === "yes" || v === "1") return { on: true };
      throw new Error("review-backfill: --input fresh= takes true or false, got " + JSON.stringify(raw));

  # ...and what it does, once the agents have produced the new entries and
  # before they are written: every LEARNED entry (tagged review-tuning) in the
  # layers of the keys this run trains — <key>, standard:<key>, emphasis:<key>
  # — is MOVED to archive:<scope> (written there, then forgotten here), never
  # deleted. Hand-written entries (no review-tuning tag) stay, and so does the
  # shared set: a per-key train never archives global entries. Nothing reads
  # archive: scopes; move an entry back with `conductor memory rescope`.
  archive: &archive
    id: archive
    run: js
    code: |
      const keys = (ctx.collect && (ctx.collect.keys || ctx.collect.repos)) || [];
      const layer = {};
      for (const k of keys) { if (k) { layer[k] = 1; layer["standard:" + k] = 1; layer["emphasis:" + k] = 1; } }
      const all = ctx.memory.recall({ limit: 0 }) || [];
      const items = [], ids = [];
      for (const m of all) {
        const scope = m.scope || "";
        const tags = m.tags || [];
        if (!scope || !layer[scope] || tags.indexOf("review-tuning") < 0) continue;
        const moved = ctx.memory.remember(String(m.text || ""), tags, "archive:" + scope);
        ctx.memory.forget(m.id);
        ids.push(m.id);
        items.push({ id: m.id, to: moved.id, scope: scope, text: String(m.text || "").slice(0, 300) });
      }
      return { ids: ids, items: items, count: items.length };

workflows:
  # ---- The review ENGINE: produces a ReviewRecord, never posts. ----
  review-team:
    description: "Multi-lens PR review: parallel lens reviewers, refute-only verify, deterministic reconcile."
    inputs:
      repo: { type: string, required: true }   # owner/name
      pr: { type: integer, required: true }
      # The review lenses — one parallel reviewer per entry. Override per run to
      # review through a subset.
      lenses:
        default:
          - name: Architecture
            focus: >-
              Dependency direction and module boundaries. Does this point dependencies the
              right way, or couple layers that should stay apart? Leaky abstractions, a
              lower layer reaching up, logic in the wrong place, a decision that will be
              costly to unwind later. Not naming or file size — that is Refactoring.
          - name: Complexity
            focus: >-
              Cognitive load of the changed code. Deep nesting, a function doing too much,
              duplicated logic that should live in one place, control flow a reader will
              struggle to follow or a maintainer will trip over. Not architecture, not style.
          - name: Performance
            focus: >-
              Real performance risk introduced by the change. N+1 queries, unbounded loops
              or allocations, work repeated in a hot path, a missing index or cache,
              blocking work on a critical path. Only where it matters at this system's
              scale — never micro-optimization.
          - name: Refactoring
            focus: >-
              Structure and size. An oversized file or function that should be split, a
              clear extraction that would simplify, dead code left behind, a pattern
              applied inconsistently. Concrete, worth-doing cleanups — not taste-level
              rewrites of working code.
          - name: Security
            focus: >-
              Exploitable weaknesses. Injection (SQL/command/XSS), auth or authz gaps,
              secrets in code or logs, missing input validation, unsafe deserialization,
              SSRF, weak or misused crypto, path traversal. Anything an attacker could use
              or that leaks data.
          - name: Test quality
            focus: >-
              Whether the tests actually verify behavior. Assertions that assert nothing,
              over-mocking that tests the mock instead of the code, tests coupled to
              implementation detail, and new logic or failure paths with no coverage. Ask:
              would this test catch the bug it exists for?
    outputs:
      event: "{{.reconcile.event}}"             # APPROVE | REQUEST_CHANGES
      summary: "{{.reconcile.summary}}"         # the review body (one line)
      comments: "{{.reconcile.comments}}"       # [{path, line, body}] — list preserved by sole-field-ref
      review: "{{.reconcile.review}}"           # JSON {event, body, comments} — the ReviewRecord to show + post
      # No `diff:` output anymore (2.10 removed it, a breaking change for any
      # consumer that reused it): a reviewer's checkout carries the real,
      # uncapped diff now, and nothing internal renders a capped copy of it —
      # see the `files`/`review` steps below. A caller that wants the raw diff
      # should call `github.pr_diff` itself.
    steps:
      # Upstream context via the github connector's read verbs (cache-aware,
      # rate-limit-aware, the connector's own credentials).
      - id: meta
        uses: github.pr_get
        options: { repo: "{{.inputs.repo}}", pr: "{{.inputs.pr}}" }   # -> .meta.title / .meta.body / .meta.base / .meta.head_sha
      # Every changed file, with its status and line counts — and, where
      # GitHub computed one, its unified-diff patch. `all: true` paginates
      # past the first 100 files: 2.10 dropped the old 300-file diff cap, so
      # a PR of any size gets its complete file list here.
      - id: files
        uses: github.pr_files
        options: { repo: "{{.inputs.repo}}", pr: "{{.inputs.pr}}", all: true }   # -> .files.files: [{path, status, additions, deletions, changes, patch}]
      # Repo-convention files (optional). continue_on_error makes a missing file
      # render empty rather than failing the workflow.
      - id: std_claude
        uses: github.file
        continue_on_error: true
        options: { repo: "{{.inputs.repo}}", path: CLAUDE.md, optional: true }
      - id: std_agents
        uses: github.file
        continue_on_error: true
        options: { repo: "{{.inputs.repo}}", path: AGENTS.md, optional: true }
      - id: std_contributing
        uses: github.file
        continue_on_error: true
        options: { repo: "{{.inputs.repo}}", path: CONTRIBUTING.md, optional: true }
      - id: existing
        # Review comments already on the PR — reviewers are told not to repeat
        # them, and reconcile drops any finding on an already-commented line.
        uses: github.review_comments
        options: { repo: "{{.inputs.repo}}", pr: "{{.inputs.pr}}", all: true }

      # The lens panel. `extends:` (not `<<:`) so this step's own guidance
      # stacks UNDER the house voice rather than replacing it — and so a
      # consumer's `review-team/review` override stacks under both.
      #
      # 2.10 (#154 §6): each lens reviewer now gets a REAL PR checkout
      # (`checkout: checkout-pr` — conductor's own worktree provisioning,
      # same mechanism the handoff step below already uses) instead of an
      # inlined, 60 KB-capped diff. A cli/acp launch with no isolation block
      # runs inside the default workspace jail; this step also carries
      # `output_schema`, which makes it a review step: its `gh` and `git` are
      # read-only (no push, no gh writes — the binaries' own profiles), and
      # it is granted no write verbs. `gh` reads and local `git` work happen
      # inside the jail.
      - id: review
        extends: *panelist
        checkout: checkout-pr
        for_each: "{{.inputs.lenses}}"
        parallel: true
        guidance: "You are one lens of a panel. Stay inside your lens; another reviewer owns the rest."
        # 3.0: per-repo LAYERED memory. The defaults (the shared/global set,
        # this repo, the workflow, the step) plus this repo's standard and
        # emphasis scopes:
        #   global              reviewer-wide standard (every repo)
        #   <owner/repo>        facts about this repo the diff can't show
        #   standard:<repo>     this repo's additions to the standard
        #   emphasis:<repo>     "look hard at X" rules learned from misses
        # The calibration triggers below write all four; you can also write
        # them by hand. Nothing matching costs no tokens.
        memory:
          limit: 100
          extra_scopes: ["standard:${repo}", "emphasis:${repo}"]
        output_schema:
          type: object
          required: [findings]
          properties:
            findings:
              type: array
              items:
                type: object
                required: [path, line, blocking, body]
                properties:
                  path: { type: string }
                  line: { type: integer }
                  blocking: { type: boolean }
                  body: { type: string }
                  confidence: { type: string, enum: [high, medium, low] }
        prompt: |
          You are reviewing a GitHub pull request through ONE lens:
          {{.item.name}} — {{.item.focus}}.

          Review like a pragmatic senior engineer. Comment on the exact NEW-file line
          where an issue lives. Cares about correctness, security, and sound design —
          not style points.

          RESTRAINT — this is the important rule. Most of your job is deciding what NOT
          to say:
          - If a thoughtful senior wouldn't bother raising it, say nothing. Don't post
            it, don't mark it non-blocking, don't note that you considered it. Silence
            is the correct output for a not-worth-it observation.
          - Returning an empty findings list is a valid, good result. On clean code,
            return []. Never manufacture or speculate a finding to look thorough — a
            made-up or "maybe" finding is worse than silence.
          - Signal density beats coverage. When a finding is borderline, leave it out.
          - A finding you can't state plainly in one sentence is usually not worth
            posting. Being unable to PROVE it from the diff alone is not a reason to
            hedge — real issues often rest on base-branch or runtime behavior; state
            them plainly and name what you'd check.

          BLOCKING (blocking: true) only for genuine show-stoppers in your lens: real
          bugs, logic errors, security holes, data-loss risk, real design flaws, or
          violations of REPO STANDARDS. Style, naming, readability, minor perf,
          optional refactors, and questions are blocking: false — no matter how many.
          Before flagging something "missing", remember a symbol absent from the
          change may exist elsewhere in the tree — you have the full checkout, so
          check rather than guess.

          VOICE: lead with the point; one thought per sentence; assume the author knows
          their system; propose a concrete fix; ~60 words per comment; don't quote the
          diff back.

          REPO STANDARDS (this repo's own conventions — violating these is blocking):
          {{.std_claude.text}}
          {{.std_agents.text}}
          {{.std_contributing.text}}

          SHARED MEMORY (appended at the end of this prompt, when there is any) is
          layered: notes tagged `standard` are the review standard — reviewer-wide, or
          this repo's additions to it — and weigh like REPO STANDARDS; notes tagged
          `emphasis` name areas of this repo that past reviews got wrong, so look hard
          at any change that touches them; every other note is a fact about this repo
          or how it is built, deployed and maintained that the diff cannot show — use
          it to judge whether the change actually works here.

          PULL REQUEST {{.inputs.repo}} #{{.inputs.pr}}: {{.meta.title}}
          Description:
          {{.meta.body}}

          COMMENTS ALREADY ON THIS PR — do NOT repeat any of these, and don't
          re-raise the same issue in different words or on a nearby line. Surface
          only what isn't already covered:
          {{range .existing.comments}}- {{.path}}:{{.line}} — {{.body}}
          {{end}}
          YOUR CHECKOUT: you have a full local clone of this PR, checked out on its
          head commit ({{.meta.head_sha}}) against base {{.meta.base}}. The complete,
          UNCAPPED change is `git diff origin/{{.meta.base}}...HEAD` — run it yourself.
          You may read any file in the tree for context (callers, tests, config,
          imports) — you are not limited to the lines that changed.

          CHANGED FILES ({{len .files.files}} total, +{{.meta.additions}}/-{{.meta.deletions}} lines):
          {{range .files.files}}- {{.path}} ({{.status}}, +{{.additions}}/-{{.deletions}})
          {{end}}
          Output JSON matching the schema: a "findings" array (possibly empty). Each
          finding: {path, line (NEW-file line in the diff), blocking, body, confidence}.

      - id: flatten
        run: js
        code: |
          const lenses = ctx.inputs.lenses || [];
          const passes = (ctx.review && ctx.review.items) || [];
          // Index every changed file's own patch once, so each finding can carry
          // just its own file's hunk(s) downstream (verify) instead of the whole
          // PR's diff.
          const filesByPath = {};
          for (const f of (ctx.files && ctx.files.files) || []) {
            if (f && f.path) filesByPath[f.path] = f;
          }
          const out = [];
          for (let i = 0; i < passes.length; i++) {
            const fs = (passes[i] && passes[i].findings) || [];
            for (const f of fs) {
              const fileInfo = filesByPath[f.path];
              out.push(Object.assign({
                id: "f" + out.length,
                lens: (lenses[i] || {}).name || "?",
                patch: (fileInfo && fileInfo.patch) || "",
              }, f));
            }
          }
          return { value: out };

      # 2.10: the unique set of files any surviving finding touched, so the
      # next step fetches each file's head-of-PR content ONCE rather than
      # once per finding.
      - id: paths
        run: js
        code: |
          const findings = (ctx.flatten && ctx.flatten.value) || [];
          const seen = {};
          const out = [];
          for (const f of findings) {
            if (f.path && !seen[f.path]) { seen[f.path] = 1; out.push(f.path); }
          }
          return { value: out };

      # The flagged file's content AT THE PR HEAD (not the base branch), one
      # fetch per unique path. `optional: true` renders empty text instead of
      # erroring for a file a finding names that no longer exists at head (a
      # rename, a delete downstream of the reviewed diff); continue_on_error
      # keeps one bad fetch from failing the whole review.
      - id: headfiles
        uses: github.file
        for_each: "{{.paths.value}}"
        parallel: true
        continue_on_error: true
        options: { repo: "{{.inputs.repo}}", path: "{{.item}}", ref: "{{.meta.head_sha}}", optional: true }

      # Build each finding's bounded verify-time context: its own file's patch
      # (already attached in `flatten`) plus a WINDOW of the file at head,
      # centered on the flagged line — bounded by both a line-count radius and
      # a hard byte cap, so a single huge file cannot blow up one finding's
      # verify call regardless of the PR's overall size.
      #
      # There is no conductor template function to slice a file by line
      # number (see internal/flow/template.go's templateFuncs — default,
      # coalesce, kv, vault, memory, secret, kvContains; nothing text- or
      # line-oriented) — this step does the slicing itself in `run: js`, the
      # same mechanism the pre-2.10 diff cap used, rather than inventing a new
      # template function.
      - id: windows
        run: js
        code: |
          const findings = (ctx.flatten && ctx.flatten.value) || [];
          const paths = (ctx.paths && ctx.paths.value) || [];
          const items = (ctx.headfiles && ctx.headfiles.items) || [];
          const textByPath = {};
          for (let i = 0; i < paths.length; i++) {
            textByPath[paths[i]] = (items[i] && items[i].text) || "";
          }
          const RADIUS = 30;      // lines of context above/below the flagged line
          const MAX_CHARS = 8000; // hard cap regardless of line length
          function windowFor(path, line) {
            const text = textByPath[path];
            if (!text) return "";
            const lines = text.split("\n");
            const at = Math.max(1, line || 1);
            const start = Math.max(1, at - RADIUS);
            const end = Math.min(lines.length, at + RADIUS);
            const out = [];
            for (let n = start; n <= end; n++) out.push(n + ": " + lines[n - 1]);
            let joined = out.join("\n");
            if (joined.length > MAX_CHARS) {
              joined = joined.slice(0, MAX_CHARS) + "\n…[window truncated at " + MAX_CHARS + " bytes]";
            }
            return joined;
          }
          return { value: findings.map(function (f) {
            return Object.assign({}, f, { window: windowFor(f.path, f.line) });
          }) };

      # Refute-verify, as a decide: step — one yes/no question per finding,
      # answered with a probability. Which model answers is the light tier's
      # business: an agent runtime answers through conductor's system_one/v1
      # adapter in one restricted session; a decision runtime the consumer
      # added to the tier (e.g. `light: ["jev-*", …]`) answers natively.
      # reconcile applies the pack's policy — refute only at >= 0.8 — so the
      # threshold lives here, in the pack, not in any model.
      #
      # 2.10: state is now PER-FINDING and bounded — the finding's own file
      # patch plus a head-of-PR line window (both from `windows` above) —
      # instead of the whole PR's capped diff. `windows.value` is `flatten.
      # value` in the same order with `patch`/`window` attached, so `reconcile`
      # below still reads `verify.items[i]` against `flatten.value[i]`
      # unchanged.
      #
      # No default: on purpose. A runtime blip retries (the house policy) and
      # then fails the review, as before, rather than quietly posting findings
      # nothing verified.
      - id: verify
        for_each: "{{.windows.value}}"
        parallel: true
        model: light
        retry: { max: 6, backoff: 30s }
        decide:
          state: |
            A first pass of a code review of {{.inputs.repo}} #{{.inputs.pr}} produced the
            FINDING below.

            FINDING (lens {{.item.lens}}, at {{.item.path}}:{{.item.line}}, blocking={{.item.blocking}}):
            {{.item.body}}

            PR DESCRIPTION:
            {{.meta.body}}

            THIS FILE'S PATCH (the diff hunk(s) touching {{.item.path}}):
            {{.item.patch}}

            {{.item.path}} AT THE PR HEAD, lines around {{.item.line}} (numbered):
            {{.item.window}}
          questions:
            refuted:
              type: noul
              instructions: >-
                You are refuting, not grading. Is this finding POSITIVELY WRONG — a
                claim that would embarrass the reviewer if posted? A finding does NOT
                need to be provable from the patch or window alone: most real issues
                depend on code elsewhere in the repo, runtime behavior, or repo
                conventions this context can't show. Answer yes ONLY when the patch,
                window, or PR description positively contradicts the finding — it
                calls something "missing" that the patch doesn't actually remove; it
                rests on a factual claim the patch/window/description plainly shows
                false; or it describes behavior the code clearly doesn't have. A
                plausible, material finding that merely isn't provable here is NOT
                refuted.
              criteria:
                true: The patch, file window, or PR description positively contradicts the finding.
                false: The finding is plausible, or merely unprovable from the available context.

      - id: reconcile
        run: js
        code: |
          const findings = (ctx.flatten && ctx.flatten.value) || [];
          // verify runs once per finding, in flatten order (windows.value —
          // verify's for_each source — is flatten.value with patch/window
          // attached, same order). The pack's policy: refute only when
          // P(refuted) >= 0.8 — default hard to keep.
          const REFUTE_AT = 0.8;
          const verdict = {};
          const answers = (ctx.verify && ctx.verify.items) || [];
          for (let i = 0; i < findings.length; i++) {
            const a = answers[i] && answers[i].refuted;
            verdict[findings[i].id] = a && a.noul >= REFUTE_AT ? "refuted" : "keep";
          }
          const existing = {};
          for (const e of ((ctx.existing && ctx.existing.comments) || [])) {
            if (e && e.path) existing[String(e.path) + ":" + (e.line || 0)] = 1;
          }
          let kept = findings.filter(function (f) {
            if (verdict[f.id] === "refuted") return false;
            return !existing[String(f.path || "") + ":" + (f.line || 0)];
          });
          kept.sort(function (a, b) { return (b.blocking ? 1 : 0) - (a.blocking ? 1 : 0); });
          const seen = {}; const uniq = [];
          for (const f of kept) {
            const k = String(f.path || "") + ":" + (f.line || 0);
            if (!seen[k]) { seen[k] = 1; uniq.push(f); }
          }
          const blockers = uniq.filter(function (f) { return f.blocking; });
          const event = blockers.length > 0 ? "REQUEST_CHANGES" : "APPROVE";
          const comments = uniq.map(function (f) {
            return { path: f.path, line: f.line, blocking: !!f.blocking, body: f.body };
          });
          const lensCount = new Set(uniq.map(function (f) { return f.lens; })).size;
          const summary = blockers.length > 0
            ? (blockers.length + " blocking issue(s) across " + lensCount + " lens(es); " + uniq.length + " comment(s) total.")
            : (uniq.length > 0 ? (uniq.length + " optional suggestion(s); nothing blocks.") : "Looks good — no issues worth raising.");
          const postComments = uniq.map(function (f) {
            return { path: f.path, line: f.line, body: f.body };
          });
          return {
            event: event,
            summary: summary,
            comments: comments,
            review: JSON.stringify({ event: event, body: summary, comments: postComments }),
          };

  # ---- The review FLOW: triage, always review, then auto-post or hand off. ----
  review-flow:
    description: "Assess a PR, run the multi-lens review team, then auto-post or hand the draft to a human."
    inputs:
      repo: { type: string, required: true }
      pr: { type: integer, required: true }
      title: { type: string, default: "" }
    outputs:
      decision: "{{.assessed.decision}}"        # auto | manual
      event: "{{.review.event}}"                # the review team's verdict
      review: "{{.review.review}}"              # the drafted ReviewRecord JSON
    steps:
      # The auto setting, read ONCE. Settings arrive as text, and a consumer
      # may write `auto: "True"` or `auto: " yes "`; every later step reads
      # this step's boolean instead of comparing the raw text itself (where a
      # spelling it didn't expect used to mean "gated", silently). A value
      # that is neither true nor false fails the run here, before anything is
      # fetched or posted.
      - id: automode
        run: js
        code: |
          // a raw template literal, so a quote or newline in the value is still
          // just text (and anything that can't even parse fails the run too)
          const raw = String.raw`${settings.auto}`;
          const v = raw.trim().toLowerCase();
          if (v === "true" || v === "yes" || v === "1") return { auto: true, mode: "auto" };
          if (v === "false" || v === "no" || v === "0") return { auto: false, mode: "gated" };
          throw new Error("pr-review-team: the auto setting must be true or false (yes/no/1/0 also accepted), got " +
                          JSON.stringify(raw) + " — fix settings.auto in your packs: block");

      # 0. Every changed file (status + line counts) and as many patches as
      #    fit a length budget, fetched through the connector and PASSED IN
      #    to triage. 2.10 replaced the old `github.pr_diff` + 60 KB cap
      #    here: `pr_files` already returns each file's patch, so there is no
      #    reason to also fetch and cap a second, whole-PR representation of
      #    the same change. The assessor used to shell out to `gh pr diff`
      #    entirely, which needed a checkout, a gh binary, and credentials
      #    the pack never declared — reaching outside its own interface to
      #    read what a verb already returns.
      - id: files
        uses: github.pr_files
        options: { repo: "{{.inputs.repo}}", pr: "{{.inputs.pr}}", all: true }
      - id: budget
        run: js
        code: |
          // The file list (path/status/+/-) is cheap and always complete —
          // every file the PR touches is named, regardless of PR size. Only
          // the PATCHES are budgeted, since those are the expensive part of
          // the prompt; files are walked in the order pr_files returned them
          // (GitHub's own deterministic order), so which patches make the
          // cut is deterministic for a given PR.
          const MAX_PATCH_BYTES = 50000;
          const files = (ctx.files && ctx.files.files) || [];
          const lines = [];
          let totalAdd = 0, totalDel = 0;
          for (const f of files) {
            lines.push("- " + f.path + " (" + f.status + ", +" + f.additions + "/-" + f.deletions + ")");
            totalAdd += f.additions || 0;
            totalDel += f.deletions || 0;
          }
          const withPatch = files.filter(function (f) { return !!f.patch; });
          let used = 0, included = 0;
          const parts = [];
          for (const f of withPatch) {
            const chunk = "--- " + f.path + " ---\n" + f.patch + "\n";
            if (used + chunk.length > MAX_PATCH_BYTES) continue;
            parts.push(chunk);
            used += chunk.length;
            included++;
          }
          let patches = parts.join("\n");
          if (included < withPatch.length) {
            patches += "\n\n…[" + (withPatch.length - included) + " more file patch(es) omitted for " +
              "length — the file list above still names every one of them]";
          }
          return {
            summary: lines.join("\n"),
            patches: patches,
            file_count: files.length,
            total_additions: totalAdd,
            total_deletions: totalDel,
          };

      # This repo's EMPHASIS entries (memory scope `emphasis:<repo>`): "look
      # hard at X" rules the calibration triggers learned from past misses.
      # The lens panel reads them through its own memory in both modes; here
      # they feed triage, where — with auto off — a PR that matches one leans
      # to a human hand-off. Read through the code binding, not the
      # memory.recall verb, so a config with no memory: section still loads:
      # no memory (or none written yet) is simply no rules.
      - id: emphasis
        if: "!automode.auto"
        run: js
        code: |
          let found = [];
          try {
            found = ctx.memory.recall({ scope: "emphasis:" + ctx.inputs.repo, limit: 50 }) || [];
          } catch (e) {
            found = [];
          }
          return { memories: found.map(function (m) { return { text: String(m.text || "") }; }) };

      # 1. Triage: may an automated review post itself ("auto"), or does this
      #    genuinely need a human ("manual")? A decide: step — four typed
      #    questions in one call — so any runtime in the light tier can answer
      #    it, a decision runtime included. `assessed` turns the answers into
      #    the auto/manual decision and the reason the hand-off shows.
      #    Skipped with `auto: true`: nothing is handed off, so there is
      #    nothing to triage.
      - id: assess
        if: "!automode.auto"
        model: light
        retry: { max: 6, backoff: 30s }
        decide:
          state: |
            Code-review request on {{.inputs.repo}}#{{.inputs.pr}} ("{{.inputs.title}}").

            EMPHASIS RULES learned from past reviews of this repo. A change that matches
            one of these needs a human's review ("manual"), whatever else holds:
            {{range .emphasis.memories}}- {{.text}}
            {{else}}(none)
            {{end}}
            FILES CHANGED ({{.budget.file_count}} total, +{{.budget.total_additions}}/-{{.budget.total_deletions}} lines):
            {{.budget.summary}}

            PATCHES (as many as fit a length budget — the file list above names every
            changed file regardless of whether its patch made the cut):
            {{.budget.patches}}
          questions:
            decision:
              type: choice
              instructions: >-
                May an automated review post itself ("auto"), or does this change
                genuinely need a human's interactive review ("manual")? DEFAULT TO
                "auto", and lean on it harder when quality clears the bar: a change
                that is adequately tested and documented with no glaring holes is
                "auto" even at the higher end of medium risk — features, refactors,
                bugfixes, tests, docs, UI, routine schema/config. "auto" does NOT mean
                "no scrutiny": the review team still reviews it; it only means no human
                is needed to gate posting the review. A large diff or unclear
                description alone is NOT a reason for "manual". When unsure, "auto".
              criteria:
                auto: The review may post itself.
                manual: >-
                  The change matches one of the EMPHASIS RULES in the request. OR the change is
                  genuinely high-stakes and needs human judgment —
                  it clearly alters security/authentication/authorization/secrets or
                  permission/ACL boundaries; touches payments, billing, or money
                  movement; is a destructive or irreversible data change (drops/renames
                  columns or tables; risky backfills/migrations with data-loss risk); or
                  changes production infra that could cause an outage or breach (IAM,
                  networking/firewall, deploy/CD to prod) — OR it fails the quality bar
                  in a way a human should weigh in on: a glaring logic or test-coverage
                  hole, or clearly missing tests on something consequential.
            tests_sufficient:
              type: noul
              instructions: >-
                Does the change carry adequate tests for the behavior it changes? Value
                real-world validation most — integration/end-to-end coverage, tests on
                realistic inputs, demonstrated results in the diff or description — but
                unit tests alone are sufficient when that is the right level for the
                change, and a change that legitimately needs no tests (pure docs,
                comments, trivial config) counts as sufficient. No only when the change
                clearly warranted more validation than it got, or tests are missing for
                behavior that needs them.
            docs_sufficient:
              type: noul
              instructions: >-
                Is the documentation/description adequate for what changed? Most changes
                need no doc updates — that counts as sufficient. No only when the change
                clearly should have documented something and didn't.
            glaring_holes:
              type: noul
              instructions: >-
                Is there a glaring hole in the logic or the test coverage — an obvious
                bug, an unhandled case that matters, or a meaningful untested path?
                Nitpicks and style are NOT glaring holes; the review team catches those.

      # The auto/manual decision and a reason for the hand-off, from the
      # typed answers (a decision carries no free text).
      - id: assessed
        run: js
        code: |
          if (ctx.automode.auto) return { decision: "auto", reason: "" };
          const a = ctx.assess || {};
          const decision = (a.decision && a.decision.choice) || "auto";
          if (decision === "auto") return { decision: decision, reason: "" };
          const why = [];
          if (a.tests_sufficient && a.tests_sufficient.noul < 0.5) why.push("tests look insufficient for the behavior changed");
          if (a.docs_sufficient && a.docs_sufficient.noul < 0.5) why.push("docs look out of date for what changed");
          if (a.glaring_holes && a.glaring_holes.noul >= 0.5) why.push("there may be a glaring logic or coverage hole");
          const rules = (ctx.emphasis && ctx.emphasis.memories) || [];
          if (why.length === 0 && rules.length > 0) why.push("it may match an emphasis rule learned from past reviews of this repo, or look high-stakes");
          if (why.length === 0) why.push("the change looks high-stakes (security, money, destructive data, or production infra)");
          return { decision: decision, reason: why.join("; ") + "." };

      # 2. Always run the review team — both branches need the drafted review.
      - id: review
        workflow: review-team
        with:
          repo: "{{.inputs.repo}}"
          pr: "{{.inputs.pr}}"

      # Decide post-vs-hand-off. With `auto: true` always post — the team's
      # verdict stands, APPROVE included. Otherwise auto-post when assess said
      # "auto", OR when the review came back clean (no comments) — handing a
      # human an empty "looks good" is pure friction — and hand a manual PR
      # with real comments to a person.
      - id: gate
        run: js
        code: |
          const mode = ctx.automode.mode;
          const auto = ctx.automode.auto === true || (ctx.assessed && ctx.assessed.decision === "auto");
          const comments = (ctx.review && ctx.review.comments) || [];
          const empty = comments.length === 0;
          return { mode: mode, post: auto || empty, handoff: !auto && !empty };

      # POST: submit the drafted review deterministically via the verb (as the
      # connector's own write identity).
      - id: post
        if: gate.post
        uses: github.submit_review
        options:
          repo: "{{.inputs.repo}}"
          pr: "{{.inputs.pr}}"
          event: "{{.review.event}}"
          body: "{{.review.summary}}"
          comments: "{{.review.comments}}"      # list preserved through the sole-field-ref

      # 3b. MANUAL: hand the DRAFT to a human. The agent presents it, asks, and on
      #     approval posts it. It does NOT re-review.
      #
      #     The prompt states INTENT only. github.submit_review is granted below,
      #     and conductor injects the verb's own call form and options into the
      #     agent's prompt (the capability card) — so the pack does not spell out
      #     a CLI incantation that would rot the moment the surface moved.
      - id: handoff
        if: gate.handoff
        <<: *house
        model: light
        mode: auto
        workspace: worktree
        checkout: checkout-pr
        background: true
        archive_when_done: false
        guidance: "When you hand back, summarize in one or two lines and give clear choices; never paste a wall of analysis into the question."
        skill:
          verbs: [github.submit_review]
        # REACTIVE: while this hand-off waits for a human, run these steps every
        # 2m. The `pr` fact step reads the PR; the action steps react. Bail if the
        # reason to review went away (merged/closed upstream, or approved
        # elsewhere) so a stale draft never sits in front of you. On new commits,
        # re-run the WHOLE review-flow on the new head (re-assess + re-review the
        # team, then re-hand-off the fresh draft) — a native `workflow:` step,
        # since the review is drafted UPSTREAM and re-running just this step would
        # show the same draft. First matching action wins, so bail takes
        # precedence over the re-review.
        watch:
          every: 2m
          steps:
            - id: pr
              uses: github.pr_get
            - if: 'pr.merged == true || pr.state == "closed"'
              uses: handoff.bail
            - if: 'pr.review_decision == "APPROVED"'
              uses: handoff.bail
            - if: "pr.head_sha != handoff.pr.head_sha"
              workflow: review-flow
              with: { repo: "{{.repo}}", pr: "{{.number}}", title: "{{.title}}" }
        # Backstop: release a hand-off nobody closed so its workspace doesn't
        # linger. handoff.done is auto-granted to the agent (it releases early the
        # moment it has nothing more for you); this is the safety net.
        idle_timeout: 24h
        prompt: |
          Review request on {{.inputs.repo}}#{{.inputs.pr}} ("{{.inputs.title}}") was flagged
          for a human's manual review: {{.assessed.reason}}

          A full multi-lens review has ALREADY been drafted for you — do NOT re-review
          from scratch. Here is the drafted ReviewRecord (JSON: event, body, comments):

          {{.review.review}}

          1. Present the drafted review in full — the body plus every inline comment
             (path:line — comment). Keep it readable.
          2. ASK with your interactive question tool (AskUserQuestion) what to do —
             post as-is / revise / discard — and WAIT for the answer. Do NOT just stop
             or go idle: this must surface as "needs your input", not "ready".
          3. Discuss and revise as needed (edit the body or drop/soften comments in the
             draft you hold). Ask again every time you need input.
          4. ONLY once explicitly approved, submit it as the PR review on
             {{.inputs.repo}}#{{.inputs.pr}}, with the approved event, body, and inline
             comments. If approved with no inline comments, submit none.

          Never post without an explicit go-ahead, and never post more than once.

# The pack ships this trigger so you never rebuild the event mapping, but it
# arrives DISARMED — no `enabled`, no repos. Arming it (enabled + repos) in the
# instance block is the consent; a github trigger is REJECTED at load if armed
# without repos.
triggers:
  - name: on_review_request
    on: github.review_requested
    steps:
      - id: run
        workflow: review-flow
        with: { repo: "{{.repo}}", pr: "{{.number}}", title: "{{.title}}" }

  # ---- Calibration: learn from what happened after past reviews. ----
  #
  # Weekly (or by hand), read what changed since the last run — reviews this
  # pack posted (from the audit log), what the reviewer's OWN account wrote by
  # hand on those PRs afterwards (owner catches: the strongest signal, and the
  # only direct one in auto mode), follow-up commits that changed lines a
  # reviewed PR added, what the human did with each hand-off draft, and what
  # teammates flagged in review — and turn the misses into memory entries the
  # lens panel reads next time. Repos come from the audit log; nothing is
  # configured per repo.
  #
  # Ships DISARMED and CONFINED. To use it:
  #   1. Grant the two script steps what they need, in your packs: block:
  #        steps:
  #          review-calibration/collect: { trust: full }
  #          review-calibration/record:  { trust: full }
  #   2. Arm it: triggers: { review-calibration: { enabled: true } }
  #   3. Run it: `conductor run <instance>/review-calibration`, or on a
  #      schedule — packs can't own one, so declare `review_calibration` on
  #      your cron connector and fire this trigger from your own config with
  #      `uses: conductor.run` (see the README).
  # Its state, clones and log live under <state_dir>/pr-review-team/.
  - name: review-calibration
    on: manual
    steps:
      - <<: *calib_script
        id: collect
        timeout: 20m
        args: [collect-calibration]
        env:
          <<: *calib_env
          WINDOW_DAYS: "${settings.calibration_window_days}"
          BOOTSTRAP_DAYS: "${settings.calibration_bootstrap_days}"
          UNMERGED_DAYS: "${settings.calibration_unmerged_days}"
          DISCARD_DAYS: "${settings.calibration_discard_days}"
          MIN_LINES: "${settings.calibration_min_lines}"
          TEAM_PAGES: "${settings.calibration_team_pages}"
      - <<: *known
        if: &calib_any "collect.count > 0 || collect.flagged > 0 || collect.handoffs > 0 || collect.owner_count > 0 || collect.team_count > 0"
      - <<: *doc_claude
        if: *calib_any
      - <<: *doc_agents
        if: *calib_any
      - <<: *doc_contributing
        if: *calib_any
      - <<: *repodocs
        if: *calib_any
      - id: calibrate
        if: *calib_any
        type: agent
        model: heavy
        checkout: none
        retry: { max: 3, backoff: 60s }
        wait_timeout: 90m
        archive_when_done: true
        memory: false            # no recall, and no ```remember harvest: entries are written only by `write`
        output_schema: *learned_schema
        prompt: |
          Calibrate an automated PR reviewer from what happened after its reviews. This
          run covers only what is NEW since {{.collect.since}}; earlier items were
          already decided. Decide everything yourself; never ask.

          THE REVIEWER is a panel of lenses (architecture, complexity, performance,
          refactoring, security, test quality, plus any the operator added). It sees the
          PR checkout, the repo's CLAUDE.md/AGENTS.md/CONTRIBUTING, and memory. Memory is
          layered, and every entry you propose has a KIND that says where it goes:
            fact      a fact about one repo the diff can't show — how something is
                      built, deployed, operated or used. Most misses are this.
            standard  a review rule for one repo: how this repo wants code shaped, a
                      convention, something that broke before.
            emphasis  an area of one repo that needs a hard look: "a PR that <touches
                      these paths / changes this kind of thing> needs close review,
                      because <why> (owner/name#N)". Use it when the reviewer
                      auto-posted on something it should have looked at much harder.
            global    a reviewer-wide lesson about how to review, true in every repo.
                      Rare; only when the evidence clearly isn't repo-specific. It
                      must cite PRs from at least two different repos — one resting
                      on a single repo is recorded as that repo's standard instead.
            none      a candidate you considered and dropped — say why in text.
          Each entry names its repo (owner/name) and cites its evidence as PR refs
          (owner/name#N) from THIS run. Entries for any other repo, or without
          evidence, are rejected.

          GOAL: find what the reviewer MISSED — problems in a PR it reviewed that
          surfaced later — and propose the entries that would have let it catch them.
          A generic example: a reviewed PR added a required environment variable; a
          follow-up made it optional because the service is deployed by a job that
          never sets it. The fact entry: "<service> is deployed by <job>, which sets
          only <these> variables; a new required variable breaks the deploy
          (owner/name#N)".

          0. OWNER CATCHES are the strongest signal there is. The reviewer posts AS
             its owner's account; each OWNER line is something that account wrote BY
             HAND on a PR the reviewer had already reviewed — a later review (its
             verdict shown; CHANGES_REQUESTED after the reviewer approved is a clear
             miss), an inline comment or a reply to one of the reviewer's own comments,
             a conversation comment, or the reviewer's review being DISMISSED. The
             owner is correcting the reviewer: treat every substantive one as a miss
             (or, replying to its comment, as a comment it should not have made or
             should have made differently) unless it is plainly unrelated chatter.
             They outrank everything below, team comments included.
          1. FOLLOW-UPS. Each FOLLOW-UP below is a commit that changed or removed lines
             a reviewed PR added, within the window after it merged, with its message
             and patch. Decide whether it fixed something the review should have
             caught — or is just the next step of the work (stacked PRs, a planned
             follow-up, a refactor). Only the first is a miss.
          2. HAND-OFF OUTCOMES are the human's direct verdict on drafts. POSTED AS-IS
             confirms the draft. In an EDITED one, a DROPPED comment is something it
             shouldn't have raised, an ADDED one something it missed, REWORDED shows
             how it should be said, a changed verdict shows misjudged severity.
             DISCARDED means the review wasn't worth posting. A comment dropped and
             re-added at a nearby line is a rewrite, not a miss.
          3. TEAM. What teammates flagged in review since the last run (bots, replies
             and the reviewer's own account excluded). On PRs marked ALSO REVIEWED BY
             THE BOT, a real issue a teammate raised that the bot did not is a miss —
             treat it like a follow-up. Across all of it, look for what the team keeps
             flagging: concerns on more than one PR or from more than one person that
             the lenses wouldn't surface on their own. One-offs, style nits and
             questions are not patterns. Weigh a comment by whether the issue is real,
             not by who posted it. The reviewer's own misses (0, 1, 2) come first; a team
             pattern carries somewhat less weight — keep it when it is clearly
             important (repeated, several people, or it caught a real bug), mark it
             team: true, and say "the team flags…" in the text.
          4. Drop a candidate (kind none) when the repo's docs or an existing entry
             already cover it, when it is not a reviewer miss (a new requirement, a
             changed plan), or when the evidence is thin. Prefer a few high-signal
             entries over many. To sharpen an existing entry rather than add a near
             duplicate, write the improved text and set supersedes to its id (same
             repo and kind).
          5. summary: one line per entry written or dropped, and why.

          OWNER CATCHES ({{.collect.owner_count}} on {{.collect.owner_prs}} reviewed PRs):
          {{.collect.owner}}

          REVIEWS ({{.collect.count}} new, {{.collect.flagged}} with follow-ups, {{.collect.handoffs}} hand-off outcome(s)):
          {{.collect.reviews}}

          TEAM COMMENTS ({{.collect.team_count}} on {{.collect.team_prs}} PRs, {{.collect.team_both}} also reviewed by the bot):
          {{.collect.team}}

          EXISTING MEMORY ENTRIES for these repos (id [scope] text):
          {{.known.text}}

          REPO DOCS:
          {{.repodocs.text}}
      - <<: *plan
        if: *calib_any
      - *write
      - <<: *calib_script
        id: record
        args: [record]
        env:
          <<: *calib_env
          MODE: calibration

  # ---- Backfill: seed memory from a window of past human review comments. ----
  #
  # One-time (manual only) map-reduce over the repos you name: one agent per
  # month extracts what reviewers look out for, one agent merges those into
  # entries, and the same restricted write path as calibration writes them.
  #   conductor run <instance>/review-backfill --input repos=owner/a,owner/b [--input days=180|all] [--input fresh=true]
  # days=all reads each repo's whole history (up to backfill_max_pages per
  # repo — a repo the cap cut short is named in the run's output and log).
  # fresh=true archives what earlier runs learned for these keys first, so the
  # result is a clean train rather than a merge (see `archive` above).
  # Grant review-backfill/collect and review-backfill/record `trust: full`
  # like calibration's, and arm it (`enabled: true`).
  - name: review-backfill
    on: [manual]
    steps:
      - <<: *calib_script
        id: collect
        timeout: 45m
        args: [collect-backfill]
        env:
          <<: *calib_env
          BACKFILL_DAYS: "{{ .inputs.days | default 365 }}"
          MAX_PAGES: "${settings.backfill_max_pages}"
          MIN_CHARS: "${settings.backfill_min_chars}"
          REVIEWER_SINCE: "${settings.backfill_reviewer_since}"
      - *fresh
      - id: extract
        if: "collect.month_count > 0"
        for_each: "{{.collect.months}}"
        parallel: true
        type: agent
        memory: false
        model: light
        checkout: none
        retry: { max: 3, backoff: 60s }
        wait_timeout: 60m
        archive_when_done: true
        output_schema:
          type: object
          required: [patterns]
          properties:
            patterns:
              type: array
              items:
                type: object
                required: [who, repo, text, evidence]
                properties:
                  who: { type: string, enum: [mine, team] }
                  repo: { type: string, description: "owner/name, or global when it is about how reviews are done in general" }
                  text: { type: string }
                  evidence: { type: array, items: { type: string } }
                  people: { type: integer }
        prompt: |
          Below is one month ({{.item.month}}) of human PR review comments, grouped by PR:
          {{.item.mine}} written by the reviewer this calibrates (MINE — hand-written,
          before an automated reviewer started posting under that account) and
          {{.item.team}} by teammates (TEAM <login>).

          Extract what reviewers here LOOK OUT FOR: concerns raised on more than one PR
          or by more than one person, and facts about how these systems work that a
          reviewer must know (how something is deployed, built, operated, or what broke
          before). A comment of MINE counts even on a single PR when it states a clear
          preference or rule. Skip one-off bugs, style nits, questions, and anything
          only meaningful inside that one PR. Comments may be AI-written; keep a
          concern only if it is real.

          Return JSON {patterns: [...]}; each: who (mine|team), repo (owner/name, or
          "global" when it is about how reviews are done in general), text (one or two
          plain sentences, stated as what a reviewer should check or know), evidence
          (PR refs, owner/name#N), people (distinct commenters who raised it). An empty
          list is a valid answer for a quiet month.

          {{.item.text}}
      - id: patterns
        if: "collect.month_count > 0"
        run: js
        code: |
          const items = (ctx.extract && ctx.extract.items) || [];
          const out = [];
          for (const it of items) for (const p of ((it && it.patterns) || [])) out.push(p);
          return { count: out.length, json: JSON.stringify(out, null, 1) };
      - <<: *known
        if: "patterns.count > 0"
      - <<: *doc_claude
        if: "patterns.count > 0"
      - <<: *doc_agents
        if: "patterns.count > 0"
      - <<: *doc_contributing
        if: "patterns.count > 0"
      - <<: *repodocs
        if: "patterns.count > 0"
      - id: merge
        if: "patterns.count > 0"
        type: agent
        model: heavy
        checkout: none
        retry: { max: 3, backoff: 60s }
        wait_timeout: 120m
        archive_when_done: true
        memory: false            # no recall, and no ```remember harvest: entries are written only by `write`
        output_schema: *learned_schema
        prompt: |
          A window ({{.collect.since}} on) of human PR review comments was split by
          month and mined for patterns: {{.patterns.count}} candidates, below (who:
          mine|team, repo, text, evidence, people). Turn them into memory entries for an
          automated PR reviewer. Decide everything yourself; never ask.

          Every entry has a KIND that says where it goes:
            fact      a fact about one repo the diff can't show (how something is
                      built, deployed, operated or used)
            standard  a review rule for one repo (a convention, how this repo wants
                      code shaped, something that broke before)
            emphasis  a kind of change in one repo that must get a hard look: "a PR
                      that <…> needs close review, because <…> (owner/name#N)"
            global    a reviewer-wide lesson, true in every repo (repo: the repo it
                      was learned on); needs evidence from at least two repos, else
                      it is recorded as that repo's standard
            none      a candidate dropped — say why in text
          Each names its repo (owner/name, one of {{.collect.repos}}) and cites evidence
          as PR refs (owner/name#N). Anything else is rejected.

          1. Merge duplicates across months: the same concern in several months is ONE
             entry, stronger for recurring. Update an existing entry (supersedes: its
             id, same repo and kind) rather than duplicate it.
          2. Drop a pattern when the repo's docs already state it, when it is a generic
             best practice the reviewer already applies, or when it rests on one
             comment that isn't MINE.
          3. WEIGHT: mine first. A team pattern needs to recur (several months, or
             several people) to be kept, and is marked team: true; when it conflicts
             with mine, mine wins. Prefer fewer, sharper entries — a year should yield
             tens, not hundreds.
          4. summary: one line per entry written, and per group merged or dropped.

          CANDIDATE PATTERNS:
          {{.patterns.json}}

          EXISTING MEMORY ENTRIES for these repos (id [scope] text):
          {{.known.text}}

          REPO DOCS:
          {{.repodocs.text}}
      - <<: *archive
        if: "fresh.on && patterns.count > 0"
      - <<: *plan
        if: "patterns.count > 0"
      - *write
      - <<: *calib_script
        id: record
        if: "patterns.count > 0"
        args: [record]
        env:
          <<: *calib_env
          MODE: backfill
