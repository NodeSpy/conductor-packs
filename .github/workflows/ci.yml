name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: pip install pyyaml
      - name: pack unit tests
        run: |
          for d in */tests; do
            echo "== $d"
            python3 -m unittest discover -s "$d" -v
          done

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: conductor pack lint (latest release)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/lint-packs.sh

  e2e:
    # pr-autopilot's moved-head steps through the real conductor, the real
    # github plugin and the GitHub fake (pr-autopilot/e2e/moved-head.sh).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with: { go-version: stable }
      - name: allow unprivileged user namespaces (the agent sandbox)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true
      - name: pr-autopilot moved-head e2e
        run: bash pr-autopilot/e2e/moved-head.sh
